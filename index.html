<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Paycheck Plan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Paycheck">
<meta name="theme-color" content="#0F2A22">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --ink:#12261F; --ink2:#3E544B; --ink3:#748A80;
  --paper:#E8EDE7; --surface:#FFFFFF; --line:#D2DBD3; --line2:#E3E9E3;
  --pine:#1E5C46; --pine-deep:#0F2A22; --pine-soft:#DCE9E0;
  --steel:#3D6E93; --violet:#6A5DA6; --clay:#B34432; --amber:#B5820F;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --shadow: 0 1px 2px rgba(18,38,31,.06), 0 6px 20px rgba(18,38,31,.09);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.num{font-family:var(--serif); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}

/* ---------- header ---------- */
.top{
  position:sticky;top:0;z-index:30;background:var(--pine-deep);color:#EAF1EB;
  padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;
}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.budget-switch{display:flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:#EAF1EB}
.budget-switch svg{opacity:.6}
.top-actions{display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#EAF1EB;background:rgba(255,255,255,.09)}
.top-headline{margin-top:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.top-headline .big{font-family:var(--serif);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.top-headline .lbl{font-size:12.5px;color:#9FBBAB;margin-bottom:3px}
.top-sub{margin-top:6px;font-size:13px;color:#9FBBAB}
.top-sub b{color:#D7E6DB;font-weight:600}

/* ---------- layout ---------- */
main{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.view{display:none}
.view.on{display:block}
h2.sec{font-family:var(--serif);font-size:21px;font-weight:600;margin:26px 0 4px;letter-spacing:-.015em}
h2.sec:first-child{margin-top:4px}
.sec-note{font-size:13.5px;color:var(--ink3);margin:0 0 14px;max-width:46ch}
.hr{height:1px;background:var(--line);margin:22px 0}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:7px 6px calc(6px + env(safe-area-inset-bottom));
  display:flex;
}
nav.tabs .inner{max-width:560px;margin:0 auto;display:flex;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:500;padding:4px 0}
nav.tabs button.on{color:var(--pine)}
nav.tabs button.on .dot{opacity:1}
.dot{width:4px;height:4px;border-radius:50%;background:var(--pine);opacity:0}

/* ---------- equalizer ---------- */
.eq-wrap{background:var(--surface);border-radius:16px;padding:16px 14px 12px;box-shadow:var(--shadow);margin-bottom:8px}
.eq-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 12px}
.eq-head h3{margin:0;font-size:14px;font-weight:600}
.eq-head span{font-size:12.5px;color:var(--ink3)}
.eq{display:flex;align-items:flex-end;gap:5px;height:96px;padding:0 2px}
.eq-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px}
.eq-bar{width:100%;border-radius:4px 4px 2px 2px;background:var(--pine-soft);position:relative;min-height:4px;transition:height .35s cubic-bezier(.2,.7,.3,1);overflow:hidden}
.eq-fill{position:absolute;left:0;right:0;bottom:0;background:var(--pine)}
.eq-col.hot .eq-fill{background:var(--clay)}
.eq-col.warm .eq-fill{background:var(--amber)}
.eq-col small{font-size:9.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.eq-col.sel small{color:var(--ink);font-weight:700}
.eq-legend{display:flex;gap:14px;padding:12px 4px 0;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line2);margin-top:12px}
.eq-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}

/* ---------- check card ---------- */
.check{
  background:var(--surface);border-radius:14px;margin-top:12px;box-shadow:var(--shadow);
  overflow:hidden;position:relative;
}
.check.past{opacity:.55}
.check::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:repeating-linear-gradient(90deg,var(--line) 0 5px,transparent 5px 10px);
}
.check-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 12px;gap:12px;width:100%;text-align:left}
.check-when{font-size:11.5px;color:var(--ink3);letter-spacing:.02em}
.check-date{font-family:var(--serif);font-size:18px;font-weight:600;margin-top:1px}
.check-amt{text-align:right}
.check-amt .in{font-size:11.5px;color:var(--ink3)}
.check-amt .left{font-family:var(--serif);font-size:20px;font-variant-numeric:tabular-nums}
.check-amt .left.neg{color:var(--clay)}
.bar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--pine-soft);margin:0 16px}
.bar span{display:block;height:100%}
.s-bill{background:var(--pine)} .s-debt{background:var(--clay)} .s-goal{background:var(--violet)} .s-allow{background:var(--steel)} .s-over{background:repeating-linear-gradient(45deg,var(--clay) 0 4px,#8f3627 4px 8px)}
.check-meta{display:flex;gap:12px;padding:9px 16px 14px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.check-meta b{font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.check-body{border-top:1px solid var(--line2);padding:4px 0 6px;display:none}
.check.open .check-body{display:block}
.check.open .chev{transform:rotate(90deg)}
.chev{transition:transform .2s;color:var(--ink3);flex:none}
.item{display:flex;align-items:center;gap:11px;padding:10px 16px;width:100%;text-align:left}
.item + .item{border-top:1px solid var(--line2)}
.tick{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.tick.done{background:var(--pine);border-color:var(--pine);color:#fff}
.item-main{flex:1;min-width:0}
.item-name{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.done .item-name{text-decoration:line-through;color:var(--ink3)}
.item-sub{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:6px;margin-top:1px}
.item-amt{font-family:var(--serif);font-size:15px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;letter-spacing:.02em}
.pill.moved{background:#EFEAF7;color:var(--violet)}
.pill.pin{background:#E7EEF4;color:var(--steel)}
.pill.late{background:#F7E5E2;color:var(--clay)}
.empty-check{padding:14px 16px;font-size:13px;color:var(--ink3)}
/* ---------- generic surfaces ---------- */
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:12px}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line2)}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:500}
.row-sub{font-size:12px;color:var(--ink3);margin-top:1px}
.row-amt{font-family:var(--serif);font-size:16px;font-variant-numeric:tabular-nums;text-align:right}
.row-amt small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink3)}
.swatch{width:9px;height:34px;border-radius:3px;flex:none}
.add{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;font-size:14.5px;font-weight:600;color:var(--pine);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-top:12px}
.btn{display:block;width:100%;padding:14px;border-radius:11px;background:var(--pine);color:#fff;font-size:15.5px;font-weight:600;text-align:center}
.btn:disabled{opacity:.4}
.btn.ghost{background:transparent;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:transparent;color:var(--clay);box-shadow:inset 0 0 0 1px #E9C9C3}
.btn.wreck{background:var(--clay);color:#fff}
.btn + .btn{margin-top:9px}
.empty{background:var(--surface);border-radius:14px;padding:26px 20px;text-align:center;box-shadow:var(--shadow)}
.empty h4{font-family:var(--serif);font-size:17px;margin:0 0 6px;font-weight:600}
.empty p{margin:0 0 16px;font-size:13.5px;color:var(--ink3);line-height:1.5}
.empty .btn{max-width:230px;margin:0 auto}

/* ---------- forms ---------- */
label.f{display:block;margin-top:15px}
label.f > span{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.hint{font-size:11.5px;color:var(--ink3);font-weight:400;margin-top:5px;line-height:1.4}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;
  appearance:none;-webkit-appearance:none;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pine);outline-offset:-1px;border-color:var(--pine)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%23748A80' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center}
.money-in{position:relative}
.money-in input{padding-left:28px}
.money-in::before{content:"$";position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-family:var(--serif)}
.seg{display:flex;background:var(--paper);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--pine);box-shadow:0 1px 3px rgba(18,38,31,.12)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 12px;border-radius:9px;background:var(--paper);font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.chip.on{background:var(--pine);color:#fff}
.chip i{width:8px;height:8px;border-radius:2px;display:block}
.chip.on i{background:#fff !important}
.two{display:flex;gap:10px}
.two > *{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-top:1px solid var(--line2);margin-top:14px}
.toggle-txt{font-size:14px;font-weight:500}
.toggle-txt small{display:block;font-size:11.5px;color:var(--ink3);font-weight:400;margin-top:2px}
.sw{width:48px;height:29px;border-radius:15px;background:var(--line);flex:none;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2.5px;left:2.5px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw.on{background:var(--pine)}
.sw.on::after{transform:translateX(19px)}
.sched{margin-top:12px;border-top:1px solid var(--line2);max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sched-row{display:flex;align-items:baseline;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line2);font-size:13px}
.sched-row span{flex:1.4;color:var(--ink2)}
.sched-row b{flex:1;text-align:right;font-family:var(--serif);font-variant-numeric:tabular-nums;font-weight:600}
.sched-row i{flex:1;text-align:right;font-style:normal;font-size:12px;color:var(--clay);font-variant-numeric:tabular-nums}
.sched-row em{flex:1.2;text-align:right;font-style:normal;font-family:var(--serif);font-variant-numeric:tabular-nums;color:var(--ink3)}
.sched-row.done{background:var(--pine-soft)}
.sched-row.done em{color:var(--pine);font-weight:600}
.sched-row.head{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0;background:var(--surface)}
.sched-row.head b,.sched-row.head i,.sched-row.head em{font-family:var(--sans);font-size:11px;font-weight:600;color:var(--ink3)}
.sched-foot{font-size:12.5px;color:var(--ink3);padding:11px 2px 2px;line-height:1.45}
.sched-more{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--pine)}
.quick{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.quick button{flex:1;min-width:56px;padding:9px 6px;border-radius:9px;background:var(--paper);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.quick button.on{background:var(--pine);color:#fff}
.amt-field{display:flex;align-items:center;gap:10px;margin-top:12px}
.amt-field .money-in{flex:1}
.amt-field input{font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(12,26,21,.42);z-index:50;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--paper);
  border-radius:20px 20px 0 0;max-height:92vh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .28s cubic-bezier(.2,.8,.3,1);
  max-width:560px;margin:0 auto;
}
.sheet.on{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.sheet-head h3{margin:0;font-family:var(--serif);font-size:19px;font-weight:600}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 18px}
.sheet-foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper);flex:none}
.x{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink2);background:rgba(18,38,31,.06)}

/* ---------- goals ---------- */
.goal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;margin-top:12px}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.goal-name{font-size:15.5px;font-weight:600}
.goal-when{font-size:12px;color:var(--ink3);margin-top:2px}
.goal-per{text-align:right;flex:none}
.goal-per b{font-family:var(--serif);font-size:19px;font-variant-numeric:tabular-nums;display:block}
.goal-per small{font-size:10.5px;color:var(--ink3)}
.track{height:7px;border-radius:4px;background:var(--paper);margin:13px 0 7px;overflow:hidden}
.track span{display:block;height:100%;border-radius:4px}
.goal-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}

/* ---------- analysis ---------- */
.score{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:20px;display:flex;align-items:center;gap:18px}
.dial{width:78px;height:78px;flex:none;position:relative}
.dial svg{transform:rotate(-90deg)}
.dial b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:24px}
.score-txt h3{margin:0 0 4px;font-family:var(--serif);font-size:18px;font-weight:600}
.score-txt p{margin:0;font-size:13px;color:var(--ink3);line-height:1.45}
.flag{background:var(--surface);border-radius:13px;box-shadow:var(--shadow);padding:14px 15px;margin-top:11px;border-left:4px solid var(--line)}
.flag.crit{border-left-color:var(--clay)}
.flag.watch{border-left-color:var(--amber)}
.flag.good{border-left-color:var(--pine)}
.flag h4{margin:0 0 5px;font-size:14.5px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.flag h4 em{font-style:normal;font-family:var(--serif);font-variant-numeric:tabular-nums;font-size:15px;flex:none}
.flag p{margin:0;font-size:13px;color:var(--ink2);line-height:1.5}
.flag p + p{margin-top:7px;color:var(--ink3)}
.flag p.fix{color:var(--pine);font-weight:500}
.cmp{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);font-size:13.5px}
.cmp th,.cmp td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line2)}
.cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--ink3);font-weight:400;font-size:12.5px}
.cmp thead th{font-size:12px;font-weight:600;background:var(--pine-soft)}
.cmp td{font-family:var(--serif);font-variant-numeric:tabular-nums}
.cmp tr:last-child td{border-bottom:0}

/* ---------- onboarding ---------- */
.ob{position:fixed;inset:0;z-index:80;background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
.ob-in{max-width:560px;margin:0 auto;width:100%;display:flex;flex-direction:column;height:100%}
.ob-bar{height:3px;background:var(--line);flex:none}
.ob-bar span{display:block;height:100%;background:var(--pine);transition:width .3s}
.ob-body{flex:1;overflow-y:auto;padding:26px 22px calc(20px + env(safe-area-inset-bottom))}
.ob-step{font-size:12px;color:var(--ink3);letter-spacing:.03em}
.ob-body h1{font-family:var(--serif);font-size:29px;line-height:1.15;margin:8px 0 10px;font-weight:600;letter-spacing:-.02em}
.ob-body > p{font-size:14.5px;color:var(--ink2);line-height:1.5;margin:0 0 6px;max-width:44ch}
.ob-foot{padding:14px 22px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);flex:none}
.ob-foot .two{gap:10px}
.mini-list{margin-top:14px}
.mini{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--surface);border-radius:11px;margin-bottom:8px;box-shadow:0 1px 2px rgba(18,38,31,.07)}
.mini b{flex:1;font-size:14px;font-weight:500}
.mini em{font-style:normal;font-family:var(--serif);font-variant-numeric:tabular-nums}
.mini button{color:var(--ink3);padding:4px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,14px);background:var(--pine-deep);color:#EAF1EB;padding:11px 17px;border-radius:11px;font-size:13.5px;z-index:70;opacity:0;pointer-events:none;transition:all .25s;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <button class="budget-switch" id="budgetBtn">
        <span id="budgetName">My budget</span>
        <svg width="11" height="7" viewBox="0 0 11 7" fill="none"><path d="M1 1l4.5 4.5L10 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="top-actions">
        <button class="icon-btn" id="settingsBtn" aria-label="Settings">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.2v2M10 15.8v2M17.8 10h-2M4.2 10h-2M15.5 4.5l-1.4 1.4M5.9 14.1l-1.4 1.4M15.5 15.5l-1.4-1.4M5.9 5.9L4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="top-headline">
      <div>
        <div class="lbl" id="topLabel">Left over each month</div>
        <div class="big num" id="topBig">$0</div>
      </div>
      <div style="text-align:right">
        <div class="lbl">Next payday</div>

<script>
"use strict";
/* ============================================================
   Paycheck Plan — data, engine
   ============================================================ */
const KEY = "paycheckplan.v1";
const CATS = [
  {id:"housing",   name:"Rent / mortgage", color:"#1E5C46", group:"housing"},
  {id:"utilities", name:"Utilities",       color:"#2F7A5A", group:"essential"},
  {id:"car",       name:"Car payment",     color:"#3D6E93", group:"transport"},
  {id:"carcost",   name:"Gas / transit / repairs", color:"#5A87A8", group:"transport"},
  {id:"insurance", name:"Insurance",       color:"#4C7FA8", group:"essential"},
  {id:"groceries", name:"Groceries",       color:"#6E9B4F", group:"essential"},
  {id:"phone",     name:"Phone / internet",color:"#7FA36A", group:"essential"},
  {id:"creditcard",name:"Credit card debt",color:"#B34432", group:"debt"},
  {id:"loan",      name:"Loan payment",    color:"#C4614A", group:"debt"},
  {id:"childcare", name:"Childcare / support", color:"#8A6BB0", group:"essential"},
  {id:"medical",   name:"Medical",         color:"#6A5DA6", group:"essential"},
  {id:"household", name:"Household & supplies", color:"#8A9B5F", group:"lifestyle"},
  {id:"personal",  name:"Personal & fun",  color:"#A2789B", group:"lifestyle"},
  {id:"subs",      name:"Subscriptions",   color:"#B5820F", group:"lifestyle"},
  {id:"other",     name:"Other",           color:"#748A80", group:"lifestyle"}
];
const catOf = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];
// what spending money can be earmarked as: no due dates, just debit-card categories
const SPEND_CATS = ["groceries","carcost","household","personal","subs","medical","childcare","phone","other"];
// what people actually owe, commonest first
const DEBT_KINDS = [
  {id:"creditcard", name:"Credit card",            cat:"creditcard"},
  {id:"personal",   name:"Personal loan",          cat:"loan"},
  {id:"student",    name:"Student loan",           cat:"loan"},
  {id:"medical",    name:"Medical bill or plan",   cat:"loan"},
  {id:"auto",       name:"Car loan",               cat:"loan"},
  {id:"store",      name:"Store card or financing",cat:"creditcard"},
  {id:"family",     name:"Money owed to family",   cat:"loan"},
  {id:"tax",        name:"Tax debt",               cat:"loan"},
  {id:"collection", name:"Collections account",    cat:"loan"},
  {id:"other",      name:"Other debt",             cat:"loan"}
];
const kindOf = e => DEBT_KINDS.find(k=>k.id===e.debtKind)
  || DEBT_KINDS.find(k=>k.cat===e.cat) || DEBT_KINDS[0];
const FREQS = [
  {id:"monthly",   name:"Monthly",        perYear:12, step:1},
  {id:"quarterly", name:"Every 3 months", perYear:4,  step:3},
  {id:"semiannual",name:"Every 6 months", perYear:2,  step:6},
  {id:"annual",    name:"Yearly",         perYear:1,  step:12},
  {id:"biweekly",  name:"Every 2 weeks",  perYear:26},
  {id:"weekly",    name:"Weekly",         perYear:52},
  {id:"once",      name:"One time",       perYear:0}
];
// frequencies counted in months rather than days; anything here needs a start date
const MONTHLY_STEP = { quarterly:3, semiannual:6, annual:12 };
const PAYF = [
  {id:"biweekly",   name:"Every 2 weeks", perYear:26},
  {id:"weekly",     name:"Weekly", perYear:52},
  {id:"semimonthly",name:"Twice a month", perYear:24},
  {id:"monthly",    name:"Monthly", perYear:12}
];

/* ---------- small utils ---------- */
const uid = () => Math.random().toString(36).slice(2,10);
const num = n => Number.isFinite(+n) ? +n : 0;   // a missing field prints $0, never $NaN
const money = n => { const v = num(n); return (v<0?"-":"") + "$" + Math.abs(Math.round(v)).toLocaleString(); };
const money2 = n => { const v = num(n); return (v<0?"-":"") + "$" + Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); };
const clamp = (n,a,b) => Math.max(a, Math.min(b,n));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function D(s){ if(s instanceof Date) return new Date(s.getFullYear(),s.getMonth(),s.getDate());
  const p = String(s).split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
function addMonths(d,n){ const x=new Date(d.getFullYear(), d.getMonth()+n, 1);
  const last = new Date(x.getFullYear(), x.getMonth()+1, 0).getDate();
  x.setDate(Math.min(d.getDate(), last)); return x; }
const lastDay = (y,m) => new Date(y, m+1, 0).getDate();
const today = () => D(new Date());
const fmtDate = d => d.toLocaleDateString(undefined,{month:"short", day:"numeric"});
const fmtLong = d => d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
const fmtMY   = d => d.toLocaleDateString(undefined,{month:"short", year:"numeric"});
// projections run years out, so show the year once it isn't this one
const fmtSmart = d => d.getFullYear() === today().getFullYear()
  ? d.toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"})
  : d.toLocaleDateString(undefined,{month:"short", day:"numeric", year:"numeric"});
const fmtSmartShort = d => d.getFullYear() === today().getFullYear()
  ? d.toLocaleDateString(undefined,{month:"short", day:"numeric"})
  : d.toLocaleDateString(undefined,{month:"short", day:"numeric", year:"numeric"});
const dayDiff = (a,b) => Math.round((D(b)-D(a))/86400000);

/* ---------- store ---------- */
let store = { budgets:[], activeId:null, seenIntro:false };
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ const p = JSON.parse(raw); if(p && p.budgets) store = p; } }
  catch(e){ console.warn("load failed", e); }
  // "keep back first" did the same job as loose spending money; merge and retire it
  (store.budgets||[]).forEach(b=>{
    if(+b.keepPerCheck > 0){ b.allowance = (+b.allowance||0) + (+b.keepPerCheck); b.keepPerCheck = 0; }
  });
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }
  catch(e){ toast("Couldn't save — device storage is full or blocked"); }
}
function newBudget(name){
  return { id:uid(), name:name||"My budget", created:iso(today()),
    pay:{ amount:0, freq:"biweekly", next:iso(addDays(today(),7)) },
    extras:[], expenses:[], goals:[], buckets:[], allowance:0, horizon:6, startBalance:0, autoPost:true,
    rollover:true, pins:{}, paid:{}, snaps:{}, log:{} };
}
const B = () => store.budgets.find(b=>b.id===store.activeId) || store.budgets[0];
// a hand-edited file, a bad import or a half-written share link shouldn't crash the app
function sanitize(b){
  if(!b) return b;
  b.expenses = (b.expenses||[]).filter(e => e && typeof e === "object");
  b.goals    = (b.goals   ||[]).filter(g => g && typeof g === "object");
  b.buckets  = (b.buckets ||[]).filter(k => k && typeof k === "object");
  b.extras   = (b.extras  ||[]).filter(x => x && typeof x === "object");
  if(!b.pay || typeof b.pay !== "object") b.pay = { amount:0, freq:"biweekly", next:iso(today()) };
  return b;
}

/* ============================================================
   Paycheck + bill occurrence generation
   ============================================================ */
function payPerYear(b){ return (PAYF.find(f=>f.id===b.pay.freq)||PAYF[0]).perYear; }
/* Spending money is the earmarked buckets plus whatever's left loose. Both are
   reserved from every check before the plan places a single bill. */
const bucketTotal = b => (b.buckets||[]).reduce((s,x)=>s+(+x.amount||0),0);
const allowanceTotal = b => (+b.allowance||0) + bucketTotal(b);
const EXTRA_FREQS = [
  {id:"once",       name:"One time",     perYear:0},
  {id:"weekly",     name:"Every week",   perYear:52},
  {id:"biweekly",   name:"Every 2 weeks",perYear:26},
  {id:"semimonthly",name:"Twice a month",perYear:24},
  {id:"monthly",    name:"Every month",  perYear:12}
];
/* Most months you get two biweekly cheques, not 2.17. Budgeting against the annual
   average invents money that isn't there for ten months of the year, so every
   figure in the app is built on the ordinary month and the extra cheques are
   called out separately. */
const TYPICAL = { weekly:4, biweekly:2, semimonthly:2, monthly:1, once:0 };
const typicalCount = freq => TYPICAL[freq] != null ? TYPICAL[freq] : 1;
// one place to convert between "per paycheck" and "in a normal month"
const tcOf = b => typicalCount(b && b.pay ? b.pay.freq : "biweekly");
const perCheckOf = (b, monthly) => (+monthly||0) / tcOf(b);
const monthlyOf  = (b, perCheck) => (+perCheck||0) * tcOf(b);
function monthlyIncome(b){
  const base = (b.pay.amount||0) * typicalCount(b.pay.freq);
  const other = (b.extras||[]).reduce((s,x)=>{
    const f = x.freq || "once";
    return s + (f === "once" ? 0 : (+x.amount||0) * typicalCount(f));
  }, 0);
  return base + other;
}
// the cheques that fall outside the ordinary month: real money, just not every month
function bonusIncome(b){
  const one = (amt, freq) => {
    const f = EXTRA_FREQS.find(v=>v.id===freq) || PAYF.find(v=>v.id===freq);
    const perYear = f ? f.perYear : 0;
    return Math.max(0, (+amt||0) * (perYear - typicalCount(freq)*12));
  };
  let total = one(b.pay.amount, b.pay.freq);
  let count = Math.max(0, payPerYear(b) - typicalCount(b.pay.freq)*12);
  (b.extras||[]).forEach(x=>{ if((x.freq||"once")!=="once") total += one(x.amount, x.freq); });
  return { total, count };
}
function genChecks(b){
  const out=[]; const start = today();
  const visibleEnd = addMonths(start, b.horizon||6);
  const end = addDays(visibleEnd, 70);
  let d = D(b.pay.next || iso(start));
  // wind back to first check on/after today if the stored next date is in the past
  let guard=0;
  while(d < start && guard++ < 400){ d = nextPay(d, b.pay.freq, b); }
  guard=0;
  while(d <= end && guard++ < 400){
    out.push({ id:"c"+iso(d), date:new Date(d), income:(b.pay.amount||0), items:[], extras:[],
                partial: d > visibleEnd });
    d = nextPay(d, b.pay.freq, b);
  }
  // other income: a second job, a spouse's pay, a one-off. Each arrival lands in
  // whichever pay period it falls inside.
  const drop = (amount, when, label) => {
    if(!out.length || !(amount>0)) return;
    let best = out[0];
    for(let i=0;i<out.length;i++){ if(out[i].date <= when) best = out[i]; }
    best.income += amount;
    best.extras.push({ label, amount, date: iso(when) });
  };
  (b.extras||[]).forEach(x=>{
    const amt = +x.amount||0, f = x.freq || "once";
    if(f === "once"){ drop(amt, D(x.date), x.label); return; }
    const step = f==="weekly" ? 7 : f==="biweekly" ? 14 : 0;
    let d = D(x.date), guard = 0;
    if(step){
      while(d < start && guard++ < 500) d = addDays(d, step);
      guard = 0;
      while(d <= end && guard++ < 500){ drop(amt, d, x.label); d = addDays(d, step); }
    } else {
      const months = f==="semimonthly" ? 0.5 : 1;
      while(d < start && guard++ < 200) d = months===0.5 ? addDays(d,15) : addMonths(d,1);
      guard = 0;
      while(d <= end && guard++ < 200){ drop(amt, d, x.label); d = months===0.5 ? addDays(d,15) : addMonths(d,1); }
    }
  });
  return out;
}
function nextPay(d, freq, b){
  if(freq==="weekly") return addDays(d,7);
  if(freq==="biweekly") return addDays(d,14);
  if(freq==="monthly") return addMonths(d,1);
  // semimonthly: keep the entered day, plus a second check ~15 days later
  const day = d.getDate();
  const anchor = b && b.pay && b.pay.next ? D(b.pay.next).getDate() : 1;
  if(day === anchor){ const ld = lastDay(d.getFullYear(), d.getMonth());
    return new Date(d.getFullYear(), d.getMonth(), Math.min(anchor+15, ld)); }
  return addMonths(new Date(d.getFullYear(), d.getMonth(), anchor), 1);
}
function occKey(e, dueIso){ return e.id + "@" + dueIso; }

/* Any recurring bill worth more than a fifth of a paycheck gets set aside a piece
   at a time. Tested against an exhaustive search: this lands within a few dollars
   of the best possible arrangement, and it's instant. */
const SPLIT_AT = 0.20;
function shouldSplit(b, e){
  const f = e.freq || "monthly";
  if(f === "once") return false;
  if(MONTHLY_STEP[f]) return true;   // a bill that lands twice a year is the whole reason
  const pay = +b.pay.amount || 0;    // sinking funds exist — always save toward it
  if(pay <= 0) return false;
  return (+e.amount||0) > pay * SPLIT_AT;
}
function autoSplit(b){
  let changed = false;
  (b.expenses||[]).forEach(e=>{
    if(e.splitManual) return;              // the user overrode this one; leave it alone
    const want = shouldSplit(b, e);
    if(!!e.sinking !== want){ e.sinking = want; changed = true; }
  });
  return changed;
}
function genOccurrences(b, endDate, startDate){
  const out=[]; const start = startDate || today();
  (b.expenses||[]).forEach(e=>{
    if(e.paused) return;
    if(e.offBudget && !startDate) return;  // paid elsewhere: not a bill, but still owed
    const amt = +e.amount || 0;
    const f = e.freq || "monthly";
    if(f==="monthly"){
      let m = new Date(start.getFullYear(), start.getMonth(), 1);
      for(let i=0;i<40;i++){
        const day = Math.min(e.dueDay||1, lastDay(m.getFullYear(), m.getMonth()));
        const due = new Date(m.getFullYear(), m.getMonth(), day);
        if(due>=start && due<=endDate) out.push(mkOcc(e, due, amt));
        m = addMonths(m,1); if(m>endDate) break;
      }
    } else if(f==="weekly" || f==="biweekly"){
      const step = f==="weekly"?7:14; let d = D(e.dueDate||iso(today()));
      let g=0; while(d<start && g++<500) d = addDays(d, step);
      g=0; while(d<=endDate && g++<500){ out.push(mkOcc(e, d, amt)); d = addDays(d, step); }
    } else if(MONTHLY_STEP[f]){
      const step = MONTHLY_STEP[f]; let d = D(e.dueDate||iso(today()));
      let g=0; while(d<start && g++<60) d = addMonths(d, step);
      g=0; while(d<=endDate && g++<60){ out.push(mkOcc(e, d, amt)); d = addMonths(d, step); }
      // also look one period back so a "set aside gradually" bill can start saving early
      if(e.sinking){ /* handled separately */ }
    } else if(f==="once"){
      const d = D(e.dueDate||iso(today()));
      if(d>=start && d<=endDate) out.push(mkOcc(e, d, amt));
    }
  });
  return out;
}
function mkOcc(e, due, amt){
  return { key:occKey(e, iso(due)), eid:e.id, name:e.name, cat:e.cat, amount:amt, freq:e.freq||"monthly",
           due:due, sinking:!!e.sinking, autopay:!!e.autopay };
}
// the window a split bill saves up over: back one full cycle from its due date
function cycleStart(o){
  const d = o.due;
  if(o.freq==="weekly")    return addDays(d,-7);
  if(o.freq==="biweekly")  return addDays(d,-14);
  if(MONTHLY_STEP[o.freq]) return addMonths(d, -MONTHLY_STEP[o.freq]);
  if(o.freq==="once")      return addDays(today(),-1);
  return addMonths(d,-1);
}
const onBudget = e => !e.offBudget;
function monthlyCost(e){
  const f = FREQS.find(x=>x.id===(e.freq||"monthly"));
  if(!f || f.perYear===0) return 0;
  return (+e.amount||0) * f.perYear / 12;
}

/* ============================================================
   The plan: assign every bill to a paycheck, then level the load
   ============================================================ */
/* A flexible goal has no deadline and no fixed amount. Each paycheck pays its
   bills first, then whatever is left runs down the flexible goals in priority
   order until it's gone — so a bill-heavy check simply contributes less, and no
   goal can ever push a paycheck short. */
const isFlex = g => !!(g && g.flex);
const debtOwed = b => (b.expenses||[])
  .filter(e => e.cat==="creditcard" || e.cat==="loan")
  .reduce((s,e)=> s + (+e.balance||0), 0);
function goalRoom(b, g){
  if(g.type === "debt") return debtOwed(b) || Infinity;
  const t = +g.target || 0;
  return t > 0 ? Math.max(0, t - (+g.saved||0)) : Infinity;
}
function goalStart(b,g){ return D(g.start || b.created || iso(today())); }
function goalEnd(b,g){ return addMonths(goalStart(b,g), +g.months||12); }
function goalMonthsLeft(b,g){
  const st = goalStart(b,g), now = today();
  const gone = Math.max(0, (now.getFullYear()-st.getFullYear())*12 + (now.getMonth()-st.getMonth()));
  return Math.max(1, (+g.months||12) - gone);
}
function goalPerCheck(b, g){
  if(isFlex(g)) return 0;            // decided per paycheck, not up front
  const tc = tcOf(b);
  const months = goalMonthsLeft(b, g);
  if(g.type==="savings"){
    const remaining = Math.max(0, (+g.target||0) - (+g.saved||0));
    if(remaining <= 0) return 0;
    return remaining / months / tc;
  }
  // debt goal: pay off `target` within months (interest approximated)
  const bal = +g.target||0, apr=(+g.apr||0)/100;
  if(bal<=0) return 0;
  const r = apr/12, n = months;
  const pmt = r>0 ? bal*r/(1-Math.pow(1+r,-n)) : bal/n;
  return pmt / tc;
}
function buildPlan(b){
  const checks = genChecks(b);
  const end = checks.length ? checks[checks.length-1].date : addMonths(today(), b.horizon||6);
  const occs = genOccurrences(b, end);
  const per = payPerYear(b);
  sanitize(b);
  const goals = b.goals.map(g=>({ ...g, per:goalPerCheck(b,g) }));
  const goalTotal = goals.reduce((s,g)=>s+g.per,0);
  const flexGoals = (b.goals||[]).filter(isFlex);
  const flexRoom = flexGoals.map(g=>goalRoom(b,g));
  const keepBack = +b.keepPerCheck||0;
  const allowance = allowanceTotal(b);
  // extra debt payments you've committed to: real money, reserved like anything else
  const debtExtra = perCheckOf(b, b.debtExtra);

  if(!checks.length) return { checks:[], occs:[], goals, goalTotal, allowance, flexGoals:[],
                              flexAvg:{}, keepBack:0, unfunded:[], per, tc: tcOf(b) };

  // split bills: save a slice from each check inside that bill's own cycle, so one
  // occurrence is never charged to more checks than it has time to save across
  const sinkingRes = [];
  occs.forEach(o=>{
    if(!o.sinking) return;
    const from = cycleStart(o);
    const span = checks.filter(c => c.date <= o.due && c.date > from);
    if(span.length > 1){
      o.spread = o.amount / span.length;
      o.spanIds = span.reduce((m,c)=>{ m[c.id]=true; return m; }, {});
      sinkingRes.push(o);
    }
  });

  // starting assignment: the latest paycheck that still lands on or before the due date
  const assign = new Map();
  const unfunded = [];
  occs.forEach(o=>{
    if(o.spread!=null) return;
    const pin = b.pins && b.pins[o.key];
    let idx = -1;
    if(pin){ idx = checks.findIndex(c=>c.id===pin); }
    if(idx<0){
      for(let i=0;i<checks.length;i++){ if(checks[i].date <= o.due) idx = i; }
    }
    if(idx<0){ unfunded.push(o); idx = 0; o.late = true; }
    o.pinned = !!pin && checks.some(c=>c.id===pin);
    o.natural = (function(){ let k=-1; for(let i=0;i<checks.length;i++) if(checks[i].date<=o.due) k=i; return k; })();
    assign.set(o.key, idx);
  });

  // fixed load that every check carries no matter what
  const fixed = checks.map(c=>{
    let f = allowance + goalTotal + debtExtra;
    sinkingRes.forEach(o=>{ if(o.spanIds[c.id]) f += o.spread; });
    return f;
  });
  const income = checks.map(c=>c.income);
  const loads = checks.map((c,i)=>fixed[i]);
  occs.forEach(o=>{ if(o.spread==null) loads[assign.get(o.key)] += o.amount; });

  // level it out: move flexible bills to earlier eligible checks to cut the worst peak.
  // Only a couple of checks early — paying February's car note in September is not help.
  const MAX_EARLY = 2;
  const ratio = (l,i) => income[i]>0 ? l/income[i] : (l>0?9:0);
  const score = arr => { let mx=0,ss=0; for(let i=0;i<arr.length;i++){ const r=ratio(arr[i],i); if(r>mx)mx=r; ss+=r*r; } return mx*100+ss; };
  const movable = occs.filter(o=>o.spread==null && !o.pinned && !o.autopay && !o.late);
  let cur = score(loads);
  for(let round=0; round<80; round++){
    let best=null;
    for(const o of movable){
      const from = assign.get(o.key);
      const earliest = Math.max(0, o.natural - MAX_EARLY);
      for(let j=earliest;j<=o.natural;j++){
        if(j===from) continue;
        loads[from]-=o.amount; loads[j]+=o.amount;
        const s = score(loads);
        loads[from]+=o.amount; loads[j]-=o.amount;
        if(s < cur - 1e-9 && (!best || s < best.s)) best = {o, from, to:j, s};
      }
    }
    if(!best) break;
    loads[best.from]-=best.o.amount; loads[best.to]+=best.o.amount;
    assign.set(best.o.key, best.to); cur = best.s;
  }

  // pack results onto each check
  checks.forEach((c,i)=>{
    c.bills=0; c.debtBills=0; c.items=[];
    c.allowance = allowance; c.free = +b.allowance||0; c.buckets = b.buckets||[];
    c.goalTotal = goalTotal; c.goals = goals; c.debtExtra = debtExtra;
    c.sinking = [];
    sinkingRes.forEach(o=>{ if(o.spanIds[c.id]){ c.sinking.push({name:o.name, amount:o.spread, due:o.due, key:o.key}); } });
    c.sinkTotal = c.sinking.reduce((s,x)=>s+x.amount,0);
  });
  occs.forEach(o=>{
    if(o.spread!=null) return;
    const c = checks[assign.get(o.key)];
    o.movedEarly = assign.get(o.key) < o.natural;
    o.checkId = c.id;
    c.items.push(o);
    c.bills += o.amount;
    if(catOf(o.cat).group==="debt") c.debtBills += o.amount;
  });
  checks.forEach(c=>{
    c.items.sort((a,b2)=> a.due-b2.due || b2.amount-a.amount);
    c.paidTotal = c.items.reduce((s,o)=> s + ((b.paid&&b.paid[o.key])?o.amount:0), 0);
    c.spent = (c.bills - c.paidTotal) + c.sinkTotal + c.allowance + c.goalTotal + c.debtExtra;
    c.surplus = c.income - c.spent;           // what this paycheck has spare
    // cascade the surplus down the flexible goals, in order, capped by what each still needs
    let spare = Math.max(0, c.surplus - keepBack);
    c.flex = [];
    flexGoals.forEach((g,i)=>{
      if(spare <= 0.5 || flexRoom[i] <= 0.5) return;
      const take = Math.min(spare, flexRoom[i]);
      c.flex.push({ id:g.id, name:g.name, type:g.type, amount:take,
                    fills: flexRoom[i] - take <= 0.5 });
      spare -= take; flexRoom[i] -= take;
    });
    c.flexTotal = c.flex.reduce((t,f)=>t+f.amount, 0);
    c.committed = c.spent;                    // everything you're obliged to cover
    c.spent += c.flexTotal;
    c.left = c.income - c.spent;
    // load measures obligations only — flexible goals fill whatever is left by
    // definition, so counting them would flatten every check to 100%
    c.load = c.income>0 ? c.committed/c.income : (c.committed>0?9:0);
  });
  // running checking balance over the next few months, so we can tell the user how
  // much of a float the monthly-bills-vs-biweekly-pay mismatch actually needs
  // flag the paychecks that fall outside the ordinary month — the third biweekly
  // cheque, the fifth weekly one. Only whole months can be judged, so the partial
  // months at each end of the window are left alone.
  const byMonth = {};
  checks.forEach(c=>{ const k = c.date.getFullYear()+"-"+c.date.getMonth();
    (byMonth[k] = byMonth[k] || []).push(c); });
  const tcm = tcOf(b);
  Object.keys(byMonth).forEach(k=>{ byMonth[k].forEach((c,i)=>{ c.bonus = i >= tcm; }); });

  let bal = +b.startBalance || 0, dip = bal;
  const soon = addDays(today(), 95);
  checks.forEach(c=>{
    bal += c.left;
    c.balance = bal;
    if(c.date <= soon && bal < dip) dip = bal;
    // "dry" should mean you actually run out, not merely that one check leans on
    // the cushion sitting in your account
    c.dry = c.left < -0.5 && bal < -0.5;
    c.covered = c.left < -0.5 && bal >= -0.5;
  });
  const shown = checks.filter(c=>!c.partial);
  // average monthly flow into each flexible goal, for the tabs that need a rate
  const flexAvg = {};
  if(shown.length){
    shown.forEach(c=> (c.flex||[]).forEach(f=>{ flexAvg[f.id] = (flexAvg[f.id]||0) + f.amount; }));
    Object.keys(flexAvg).forEach(k=>{ flexAvg[k] = monthlyOf(b, flexAvg[k] / shown.length); });
  }
  return { checks: shown, occs, goals, goalTotal, allowance, debtExtra, flexGoals, flexAvg,
           keepBack, unfunded, per, tc: tcOf(b), buffer: Math.max(0, -dip) };
}

/* ============================================================
   Debt payoff simulation (snowball vs avalanche)
   ============================================================ */
function debtList(b){
  return (b.expenses||[]).filter(e=> e.cat==="creditcard" || e.cat==="loan")
    .map(e=>({ id:e.id, name:e.name, cat:e.cat, balance:+e.balance||0, apr:+e.apr||0,
               min:monthlyCost(e), offBudget:!!e.offBudget, left:+e.paymentsLeft||0 }))
    .filter(d=> d.balance>0);
}
function simulate(debts, extra, method){
  const ds = debts.map(d=>({...d, paidMonth:null, trail:[]}));
  let months=0, interest=0, guard=0;
  const timeline=[];
  while(ds.some(d=>d.balance>0.005) && guard++ < 600){
    months++;
    let pool = extra;
    ds.forEach(d=>{
      if(d.balance<=0) return;
      const i = d.balance * (d.apr/100/12);
      d.balance += i; interest += i;
      d._mi = i; d._mp = 0;
    });
    // minimums first
    ds.forEach(d=>{
      if(d.balance<=0) return;
      const pay = Math.min(d.balance, d.min);
      d.balance -= pay; d._mp = (d._mp||0) + pay;
      if(d.min > pay) pool += (d.min - pay);
    });
    // freed-up minimums from finished debts roll forward
    ds.forEach(d=>{ if(d.balance<=0.005 && d.paidMonth===null){ d.balance=0; d.paidMonth=months; } });
    ds.filter(d=>d.paidMonth!==null && d.paidMonth<months).forEach(d=>{ pool += d.min; });
    // extra goes to the target
    let live = ds.filter(d=>d.balance>0.005);
    live.sort(method==="snowball" ? (a,b2)=>a.balance-b2.balance : (a,b2)=>b2.apr-a.apr || a.balance-b2.balance);
    for(const d of live){
      if(pool<=0) break;
      const pay = Math.min(d.balance, pool);
      d.balance -= pay; pool -= pay; d._mp = (d._mp||0) + pay;
      if(d.balance<=0.005){ d.balance=0; d.paidMonth=months; }
    }
    ds.forEach(d=>{
      if(d._mp > 0 || d._mi > 0){
        d.trail.push({ month:months, paid:d._mp||0, interest:d._mi||0, balance:d.balance });
      }
      d._mp = 0; d._mi = 0;
    });
    timeline.push(ds.reduce((s,d)=>s+d.balance,0));
    if(months>1 && timeline[months-1] >= timeline[months-2] - 0.01) { // making no progress
      return { months:Infinity, interest:Infinity, order:ds, stuck:true, timeline };
    }
  }
  const order = ds.slice().sort((a,b2)=>(a.paidMonth||999)-(b2.paidMonth||999));
  return { months, interest, order, stuck:false, timeline };
}
function debtSummary(b, plan){
  const debts = debtList(b);
  const totalBal = debts.reduce((s,d)=>s+d.balance,0);
  const totalMin = debts.reduce((s,d)=>s+d.min,0);
  const offMin   = debts.filter(d=>d.offBudget).reduce((s,d)=>s+d.min,0);
  const wApr = totalBal>0 ? debts.reduce((s,d)=>s+d.apr*d.balance,0)/totalBal : 0;
  const billsM = (b.expenses||[]).filter(onBudget).reduce((s,e)=>s+monthlyCost(e),0);
  const allowM = monthlyOf(b, allowanceTotal(b));
  const savM = (b.goals||[]).filter(g=>g.type==="savings" && !g.flex)
    .reduce((s,g)=>s+monthlyOf(b,goalPerCheck(b,g)),0);
  // what's spare before any extra debt payment is committed
  const avgLeft = monthlyIncome(b) - billsM - allowM - savM;
  // fixed debt payoff goals already send money above the minimums
  const goalExtra = (b.goals||[]).filter(g=>g.type==="debt" && !g.flex)
    .reduce((s,g)=>s + monthlyOf(b,goalPerCheck(b,g)), 0);
  // and a flexible one picks up whatever the checks could spare
  const flexDebt = (b.goals||[]).filter(g=>g.flex && g.type==="debt")
    .reduce((s,g)=>s + ((plan.flexAvg||{})[g.id]||0), 0);
  const committed = +b.debtExtra || 0;      // reserved from every check, on top of goals
  const headroom = Math.max(0, avgLeft - goalExtra - committed - flexDebt);
  const extra = goalExtra + committed + flexDebt;   // total going in above the minimums
  return { debts, totalBal, totalMin, offMin, wApr, extra, committed, flexDebt,
           headroom, avgLeft, goalExtra };
}

/* ============================================================
   Evening out the leftovers
   Splitting every bill isn't the answer: small bills are the app's only
   flexible levers, and freezing them makes the fit worse. So try splits
   one at a time and keep only the ones that actually steady the leftovers.
   ============================================================ */
function evenness(bb){
  const p = buildPlan(bb);
  const L = p.checks.filter(c=>!c.items.some(o=>o.late)).map(c=>c.left);
  if(!L.length) return { sd:Infinity, lo:0, hi:0 };
  const m = L.reduce((a,x)=>a+x,0)/L.length;
  return { sd: Math.sqrt(L.reduce((a,x)=>a+(x-m)*(x-m),0)/L.length),
           lo: Math.min(...L), hi: Math.max(...L) };
}
function evenOut(b){
  const work = JSON.parse(JSON.stringify(b));
  const before = evenness(work);
  let best = before; const changed = [];
  for(let pass=0; pass<work.expenses.length; pass++){
    let pick = null;
    for(const e of work.expenses){
      if(e.sinking || e.freq==="once") continue;
      e.sinking = true;
      const s = evenness(work);
      e.sinking = false;
      if(s.sd < best.sd - 1 && (!pick || s.sd < pick.s.sd)) pick = { e, s:s };
    }
    if(!pick) break;
    pick.e.sinking = true; best = pick.s; changed.push(pick.e.name);
  }
  return { changed, before, after:best,
           flags: work.expenses.reduce((m,e)=>{ m[e.id]=!!e.sinking; return m; },{}) };
}

/* ============================================================
   Budget analysis — the red flags
   ============================================================ */
function analyze(b, plan){
  const flags = [];
  const per = plan.per, inc = monthlyIncome(b);
  const exp = (b.expenses||[]).filter(onBudget);
  const sumCat = ids => exp.filter(e=>ids.includes(e.cat)).reduce((s,e)=>s+monthlyCost(e),0);
  const billsM = exp.reduce((s,e)=>s+monthlyCost(e),0);
  const allowM = monthlyOf(b, allowanceTotal(b));
  let savingsM = (b.goals||[]).filter(g=>g.type==="savings").reduce((s,g)=>s+monthlyOf(b,goalPerCheck(b,g)),0);
  const debtGoalM = (b.goals||[]).filter(g=>g.type==="debt").reduce((s,g)=>s+monthlyOf(b,goalPerCheck(b,g)),0);
  // what the flexible goals actually picked up, averaged over the planned checks
  const cs = plan.checks || [];
  const flexOf = t => cs.length
    ? cs.reduce((s,c)=> s + (c.flex||[]).filter(f=>f.type===t).reduce((u,f)=>u+f.amount,0), 0)
      / cs.length * tcOf(b)
    : 0;
  const flexSaveM = flexOf("savings"), flexDebtM = flexOf("debt");
  savingsM += flexSaveM;
  const extraM = (+b.debtExtra || 0) + flexDebtM;
  const leftM = inc - billsM - allowM - savingsM - debtGoalM - extraM;
  const pct = n => inc>0 ? n/inc*100 : 0;
  const add = (sev,title,val,why,fix,action) => flags.push({sev,title,val,why,fix,action});

  if(inc<=0){ add("crit","No income entered yet","",
    "Every number in this app is measured against your take-home pay. Without it there's nothing to plan against.",
    "Add your net paycheck under Money."); return {flags, score:0, inc, billsM, allowM, savingsM, leftM}; }

  // 1. does it even balance
  let stretchedGoal = null;
  if(leftM < -1){
    const gap = -leftM;
    let act = null;
    const gs = (b.goals||[]).slice().sort((x,y)=>goalPerCheck(b,y)-goalPerCheck(b,x));
    if(gs.length){
      const g = gs[0], curM = monthlyOf(b,goalPerCheck(b,g)), targetM = curM - gap;
      if(targetM > 0){
        for(let m=(+g.months||12)+1; m<=180; m++){
          if(monthlyOf(b, goalPerCheck(b, Object.assign({}, g, {months:m}))) <= targetM + 0.5){
            act = { label:'Stretch "'+g.name+'" to '+m+" months", act:"stretchGoal", id:g.id, months:m };
            stretchedGoal = g.id;
            break;
          }
        }
      }
    }
    if(!act && (+b.allowance||0) > 0){
      const cut = Math.max(0, Math.floor(((+b.allowance||0) - perCheckOf(b,gap))/5)*5);
      act = { label:"Cut loose spending to "+money(cut)+" a check", act:"trimAllowance", to:cut };
    }
    add("crit","You're spending more than you earn", money(leftM)+"/mo",
      "Bills, spending money, goals and extra debt payments add up to "+money(billsM+allowM+savingsM+debtGoalM+extraM)+" a month against "+money(inc)+" coming in. This gap gets covered by credit cards or overdrafts.",
      "Cut "+money(gap)+" a month, or stretch a goal timeline so it asks for less.", act);
  }
  else if(flexSaveM + flexDebtM > 0) add("good","Every spare dollar has a job",
    money(flexSaveM + flexDebtM)+"/mo",
    "Your flexible goals pick up whatever each paycheck can spare — "+money(flexSaveM)+" to savings and "+money(flexDebtM)+" at your debts on an average month. Bills come first, so a heavy check simply contributes less instead of leaving you short.","");
  else if(leftM < inc*0.02) add("watch","Almost nothing left after the plan", money(leftM)+"/mo",
    "You're running at the edge. One unexpected car repair or medical copay puts you into a card.",
    "Aim to leave at least "+money(inc*0.05)+" a month unassigned as breathing room.");
  else add("good","Your plan balances", money(leftM)+"/mo spare",
    "After every bill, your allowance and your goals, there's still money unassigned each month.","");

  // 2. housing
  const housing = sumCat(["housing"]);
  if(housing>0){
    const p = pct(housing);
    if(p>40) add("crit","Housing is eating your paycheck", Math.round(p)+"% of take-home",
      "The common guideline is 30% of gross pay on housing. Yours is "+Math.round(p)+"% of take-home, which is well past that in real terms and leaves little room for everything else.",
      "This usually can't be fixed with discipline. A roommate, a cheaper lease at renewal, or renegotiating is the realistic lever.");
    else if(p>33) add("watch","Housing is on the high side", Math.round(p)+"% of take-home",
      "You're above the 30% rule of thumb. It's workable, but it means the rest of your budget has to stay lean.",
      "Keep other fixed bills below 20% of pay so this stays manageable.");
    else add("good","Housing is in a healthy range", Math.round(p)+"% of take-home","Comfortably inside the usual 30% guideline.","");
  } else add("watch","No housing cost entered","",
    "Rent or mortgage is usually the biggest single line in a budget. If someone else covers it, ignore this.",
    "Add it under Money so the analysis is accurate.");

  // 3. non-mortgage debt load
  const debtM = sumCat(["creditcard","loan"]);
  const carM  = sumCat(["car"]);
  const dPct = pct(debtM + carM);
  if(dPct>20) add("crit","Debt payments are too large a share", Math.round(dPct)+"% of take-home",
    "Lenders start calling this distress territory past 20%. Every dollar here is a dollar that can't go to savings, and the interest keeps the balance sticky.",
    "See the Debt tab — a focused payoff order will clear this faster than spreading extra money evenly.");
  else if(dPct>12) add("watch","Debt payments are worth watching", Math.round(dPct)+"% of take-home",
    "Under 20% is the usual comfort line, but you're close enough that a new loan would tip it.",
    "Hold off on new financing until this drops under 10%.");
  else if(debtM+carM>0) add("good","Debt load is manageable", Math.round(dPct)+"% of take-home","Comfortably under the 20% line lenders watch.","");

  // 4. savings rate
  const sPct = pct(savingsM);
  if(savingsM<=0 && !(b.goals||[]).some(g=>g.flex)) add("crit","You're not saving anything", "0%",
    "With no savings line, any surprise expense becomes debt by default. This is the single most common reason budgets collapse.",
    "Start a goal in the Goals tab, even at "+money(Math.max(25, inc*0.02))+" a check. The habit matters more than the amount.");
  else if(sPct<10 && flexDebtM > flexSaveM) add("good","Savings is light on purpose right now",
    Math.round(sPct)+"% saving, "+money(flexDebtM)+"/mo at debt",
    "Most of your spare money is going at balances rather than into savings, which is the right order while you owe at these rates. Once the debts clear, that "+money(flexDebtM)+" a month lands in savings instead without you changing anything.","");
  else if(sPct<10) add("watch","Savings rate is light", Math.round(sPct)+"%",
    "The usual target is 15-20% of pay across emergency fund and retirement. You're at "+Math.round(sPct)+"%.",
    "Another "+money(Math.max(25, inc*0.15 - savingsM))+" a month would get you to 15%. Stretching a goal's timeline is the painless way to find it.");
  else if(sPct>=20) add("good","Strong savings rate", Math.round(sPct)+"%","You're at or above the 20% target most planners use.","");
  else add("good","Decent savings rate", Math.round(sPct)+"%","Above the 10% floor. Pushing toward 20% is the next step.","");

  // 5. emergency fund
  const hasEF = (b.goals||[]).some(g=>g.type==="savings" &&
    (isFlex(g) || /emerg|rainy|buffer|cushion/i.test(g.name||"")));
  const monthlyNeed = billsM + allowM;
  if(!hasEF) add("watch","No emergency fund goal","3 months = "+money(monthlyNeed*3),
    "Before any other savings goal, most guidance says to bank three months of essential spending. Yours would be about "+money(monthlyNeed*3)+".",
    "Starting one is worth more than the amount you start with.",
    { label:"Start an emergency fund goal", act:"addEF", amount:Math.round(monthlyNeed*3), months:24 });

  // 6. spending allowance
  const aPct = pct(allowM);
  if(allowM<=0) add("watch","No spending money set aside","",
    "A budget with zero personal spending built in is the kind people abandon in week three. Groceries, gas, a haircut all have to come from somewhere.",
    "Even a small amount held back from each check makes the plan survivable.",
    { label:"Set aside "+money(perCheckOf(b, inc*0.08))+" a check", act:"setAllowance",
      to: Math.round(perCheckOf(b, inc*0.08)/5)*5 });
  else if(aPct>30) add("watch","Spending money is a big slice", Math.round(aPct)+"% of take-home",
    "Nearly a third of your pay is spending money. That's fine if it's deliberate, but it's usually where the missing savings went.",
    "Trimming it by a quarter would free "+money(allowM*0.25)+" a month for goals.",
    (+b.allowance||0) > 0 ? { label:"Trim loose spending by a quarter", act:"trimAllowance",
      to: Math.round((+b.allowance||0)*0.75/5)*5 } : null);

  // 7. transport
  const tPct = pct(carM + sumCat(["carcost"]));
  if(tPct>20) add("watch","Transportation is heavy", Math.round(tPct)+"% of take-home",
    "Car payment, gas, insurance and repairs together are usually kept under 15% of pay. Vehicles quietly crowd out everything else.",
    "Worth checking whether the car payment can be refinanced or the vehicle downgraded at trade-in.");

  // 8. subscriptions
  const subs = sumCat(["subs"]);
  if(subs > Math.max(100, inc*0.04)) add("watch","Subscriptions add up", money(subs)+"/mo",
    "That's "+money(subs*12)+" a year on recurring services, and these are the easiest bills to forget you're paying.",
    "Cancelling half would fund "+money(subs*6)+" toward savings this year.");

  // 9. bill-heavy checks
  const over = plan.checks.filter(c=>c.left < -1);
  const worst = plan.checks.reduce((m,c)=> c.load>((m&&m.load)||0)?c:m, null);
  if(over.length && leftM < -1){
    add("crit", over.length+(over.length>1?" paychecks run":" paycheck runs")+" out before the next one",
      Math.round(worst.load*100)+"% on the "+fmtDate(worst.date)+" check",
      "Because the budget is short overall, no amount of shuffling fixes this. Bills already sit on the latest paycheck that beats their due date.",
      "The fix has to come from the total, not the timing.");
  } else if(plan.buffer > 1){
    add("watch","You need a cushion in checking", money(plan.buffer),
      "Your budget balances across a month, but bills land monthly and your pay doesn't. Following this plan, your checking balance bottoms out around "+money(-plan.buffer)+" in the next three months before pay catches it up.",
      "Keep about "+money(Math.ceil(plan.buffer/50)*50)+" in checking as a float, or move one due date to the other half of the month. Entering your real checking balance under Money makes this number accurate.");
  } else if(worst && worst.load>1.15){
    add("watch","One check carries much more than the rest", Math.round(worst.load*100)+"% of the "+fmtDate(worst.date)+" check",
      "It's covered by what's already in checking, but that paycheck is doing far more work than the others.",
      "Moving one due date into the other half of the month would flatten this out.");
  } else if(plan.checks.length) {
    const loads = plan.checks.map(c=>c.load);
    const hi = Math.max(...loads), spread = hi - Math.min(...loads);
    if(hi <= 0.85) add("good","Every paycheck has room", Math.round(hi*100)+"% at the busiest",
      "Even your heaviest check is comfortably covered by its own pay.","");
    else if(spread <= 0.30) add("good","Your paychecks are evenly loaded", Math.round(spread*100)+" point spread",
      "No single check carries a disproportionate share, and none of them run dry before the next one lands.","");
    else add("watch","Bills cluster on some checks", Math.round(spread*100)+" point spread",
      "The busiest check is at "+Math.round(hi*100)+"% while the lightest sits at "+Math.round(Math.min(...loads)*100)+"%. Due dates are bunched, so the app can only even it out so far.",
      "Moving one or two due dates to the other half of the month would flatten the difference.");
  }

  // 9b. one bill hogging a whole check
  const perCheck = +b.pay.amount || 0;
  const chunky = exp.filter(e => !e.sinking && (+e.amount||0) > perCheck*0.45
                   && (e.freq||"monthly") !== "once")
                   .sort((x,y)=>(+y.amount)-(+x.amount));
  if(perCheck>0 && chunky.length){
    const e = chunky[0];
    const share = Math.round((+e.amount)/perCheck*100);
    const slices = Math.max(2, tcOf(b));
    const slice = (+e.amount)/slices;
    add("watch","\""+e.name+"\" swallows a whole paycheck", share+"% of one check",
      "At "+money(e.amount)+" it takes "+share+"% of whichever check it lands on, so that check has almost nothing left while the next one sits nearly empty. Moving the whole bill between checks can't fix that — it's too big to fit comfortably on either.",
      "Splitting it sets aside about "+money(slice)+" from each check instead of taking it all from one.",
      { label:"Split "+e.name+" across checks", act:"splitBill", id:e.id });
  }

  // 9c. paid-off cards still carrying a payment
  const cleared = exp.filter(e => isDebtCat(e.cat) && (+e.amount||0) > 0 && (+e.balance||0) <= 0 && e.apr != null);
  if(cleared.length) add("good", cleared.length>1 ? "Cleared debts still on the plan" : "\""+cleared[0].name+"\" is paid off",
    money(cleared.reduce((s2,e)=>s2+monthlyCost(e),0))+"/mo freed",
    (cleared.length>1 ? cleared.map(e=>e.name).join(" and ")+" have" : "It has")+" a zero balance but the payment is still in your bills, so the plan is holding money back for it.",
    "Removing it hands that money back to every paycheck.",
    cleared.length===1 ? { label:"Remove the "+cleared[0].name+" payment", act:"removeBill", id:cleared[0].id } : null);

  // 9d. every flexible goal filled up, so the surplus has nowhere left to land
  const flexG = (b.goals||[]).filter(g=>g.flex);
  const idleChecks = plan.checks.filter(c => c.flexTotal <= 0.5 && c.left > inc*0.02);
  if(flexG.length && idleChecks.length && !flexG.some(g=>goalRoom(b,g) === Infinity)){
    add("watch","Your goals fill up before the plan ends",
      money(idleChecks[0].left)+" idle from "+fmtSmartShort(idleChecks[0].date),
      "Every flexible goal has a target, and once they're all met the spare money on each paycheck stops going anywhere. "+idleChecks.length+" of your upcoming paychecks already have nothing to feed.",
      "A goal with no target catches whatever's left over after the others are full.",
      { label:"Add a catch-all savings goal", act:"addCatchAll" });
  }

  // 10. high APR
  const highApr = debtList(b).filter(d=>d.apr>=22);
  if(highApr.length) add("watch","High interest rate"+(highApr.length>1?"s":""), Math.round(Math.max(...highApr.map(d=>d.apr)))+"% APR",
    highApr.map(d=>d.name).join(", ")+" charges over 22%. At that rate the balance grows faster than most people can pay it down with minimums alone.",
    "A credit union personal loan or a balance transfer offer usually cuts this in half.");

  // 11. goal feasibility
  (b.goals||[]).filter(g=>!isFlex(g)).forEach(g=>{
    const p = goalPerCheck(b,g);
    if(p > 0 && leftM < 0)
      add("watch","\""+g.name+"\" may be too aggressive", money(p)+"/check",
        "Hitting "+money(g.target)+" in "+g.months+" months needs "+money(p)+" from every check, and the budget doesn't have room for it.",
        "Stretching the deadline is the least painful lever you have.",
        stretchedGoal === g.id ? null
          : { label:"Stretch it to "+Math.ceil(g.months*1.5)+" months", act:"stretchGoal",
              id:g.id, months:Math.ceil(g.months*1.5) });
  });

  // score
  let score = 100;
  flags.forEach(f=>{ if(f.sev==="crit") score-=18; else if(f.sev==="watch") score-=7; else score+=2; });
  score = clamp(Math.round(score), 5, 100);
  return { flags, score, inc, billsM, allowM, savingsM, debtGoalM, extraM, leftM,
           flexSaveM, flexDebtM, hasFlex:(b.goals||[]).some(g=>g.flex) };
}

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2300); }

function render(){
  const b = B();
  if(!b) return;
  sanitize(b);
  let dirty = autoSplit(b);
  PLAN = buildPlan(b);
  const justPosted = autoPostPayments(b, PLAN);
  if(justPosted.length){ LAST_POSTED = justPosted; dirty = true; PLAN = buildPlan(b); }
  if(snapshot(b, PLAN)) dirty = true;
  if(dirty) save();
  const a = analyze(b, PLAN);
  $("budgetName").textContent = b.name;
  const next = PLAN.checks[0];
  $("topNext").textContent = next ? fmtDate(next.date) : "Add pay";
  if(TAB==="bills"){
    const billsM = b.expenses.reduce((s2,e)=>s2+monthlyCost(e),0);
    $("topLabel").textContent = "Bills each month";
    $("topBig").textContent = money(billsM);
    $("topBig").style.color = "#EAF1EB";
    $("topSub").innerHTML = b.expenses.length
      ? `${b.expenses.length} bill${b.expenses.length===1?"":"s"} · <b>${money(a.inc>0?billsM/a.inc*100:0).replace("$","")}%</b> of take-home`
      : "Nothing added yet";
  } else if(TAB==="debt"){
    const ds = debtSummary(b, PLAN);
    $("topLabel").textContent = "Total balance owed";
    $("topBig").textContent = money(ds.totalBal);
    $("topSub").innerHTML = ds.totalBal>0 ? `Minimums <b>${money(ds.totalMin)}/mo</b> · Average rate <b>${ds.wApr.toFixed(1)}%</b>` : "No card or loan balances entered";
  } else {
    $("topLabel").textContent = a.hasFlex ? "Going to goals each month" : "Unassigned each month";
    $("topBig").textContent = money(a.hasFlex ? (a.flexSaveM + a.flexDebtM) : a.leftM);
    $("topBig").style.color = a.leftM<0 ? "#F0A99B" : "#EAF1EB";
    const bon = bonusIncome(b);
    $("topSub").innerHTML = `In an ordinary month: take-home <b>${money(a.inc)}</b> · Bills <b>${money(a.billsM)}</b> · Spending <b>${money(a.allowM)}</b> · Goals <b>${money(a.savingsM + (a.debtGoalM||0))}</b>${a.extraM>0?` · Extra debt <b>${money(a.extraM)}</b>`:""}${bon.count>0?` · Plus <b>${bon.count} extra paycheck${bon.count>1?"s":""}</b> a year` : ""}`;
  }
  renderTabs();
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  $("view-"+TAB).classList.add("on");
  if(TAB==="plan") renderPlan(b);
  if(TAB==="bills") renderBills(b);
  if(TAB==="money") renderMoney(b);
  if(TAB==="goals") renderGoals(b);
  if(TAB==="debt") renderDebt(b);

}

/* ---------- Plan ---------- */
function renderPlan(b){
  const el = $("view-plan");
  if(!b.pay.amount){
    el.innerHTML = `<div class="empty"><h4>Nothing set up yet</h4>
      <p>The guided setup walks through pay, bills, spending and goals in order. Or add the pieces yourself, in whatever order suits you.</p>
      <button class="btn" data-act="runSetup">Walk me through it</button>
      <button class="btn ghost" style="max-width:230px;margin:9px auto 0" data-act="editPay">Just add my pay</button></div>`;
    return;
  }
  if(!b.expenses.length){
    el.innerHTML = `<div class="empty"><h4>No bills yet</h4>
      <p>As soon as there are a couple, the app starts deciding which paycheck each one comes out of. Income and spending money can wait if you'd rather do those first.</p>
      <button class="btn" data-act="addExpense">Add a bill</button>
      <button class="btn ghost" style="max-width:230px;margin:9px auto 0" data-act="goMoney">Go to Money instead</button></div>`;
    return;
  }
  const cs = PLAN.checks;
  const maxLoad = Math.max(1, ...cs.map(c=>c.load));
  const eq = cs.slice(0,13).map((c,i)=>{
    const h = clamp(c.load/maxLoad*100, 5, 100);
    const cls = c.dry ? "hot" : (c.covered || c.load > 0.93) ? "warm" : "";
    return `<button class="eq-col ${cls} ${openChecks[c.id]?'sel':''}" data-eq="${c.id}" aria-label="${fmtLong(c.date)}, ${Math.round(c.load*100)} percent used${c.bonus?", an extra paycheck":""}">
      <div class="eq-bar" style="height:${h}%"><div class="eq-fill" style="height:100%"></div></div>
      <small>${c.bonus?"★":""}${c.date.getDate()}</small></button>`;
  }).join("");
  const dry = cs.filter(c=>c.dry).length;
  // ignore checks distorted by bills that were already due before the plan started
  const clean = cs.filter(c=>!c.items.some(o=>o.late));
  const lefts = (clean.length?clean:cs).map(c=>c.left);
  const lo = Math.min(...lefts), hi = Math.max(...lefts);
  const band = Math.abs(hi-lo) < 25 ? money(lo)+" every check"
             : money(lo)+" to "+money(hi);
  const swept = cs.some(c=>c.flexTotal>0);
  el.innerHTML = `
    <div class="eq-wrap">
      <div class="eq-head"><h3>${swept?"What each check spares for goals":"What you keep after each check"}</h3><span class="num">${swept?money(Math.min(...cs.map(c=>c.flexTotal)))+" to "+money(Math.max(...cs.map(c=>c.flexTotal))):band}</span></div>
      <div class="eq">${eq}</div>
      <div class="eq-legend"><span><i style="background:var(--pine)"></i>covered</span><span><i style="background:var(--amber)"></i>tight</span><span><i style="background:var(--clay)"></i>over</span>${cs.some(c=>c.bonus)?`<span>★ extra paycheck</span>`:""}</div>
    </div>
    ${(()=>{
      const nx = cs.find(c=>c.bonus);
      if(!nx) return "";
      const goes = nx.flex && nx.flex.length
        ? nx.flex.map(f=>esc(f.name)+" "+money(f.amount)).join(", ")
        : (nx.left > 0 ? "nothing — it's sitting unassigned" : "covering the bills on it");
      return `<div class="flag good" style="margin-top:12px"><h4><span>Extra paycheck on ${fmtSmartShort(nx.date)}</span><em>${money(nx.income)}</em></h4>
        <p>Most months bring ${tcOf(b)} paychecks; that month has ${tcOf(b)+1}. Only ${money(nx.spent - nx.flexTotal)} of it is spoken for by bills and spending money, so ${money(nx.income - nx.spent + nx.flexTotal)} is free.</p>
        <p class="fix">Where it goes: ${goes}.</p></div>`;
    })()}
    ${(()=>{ const p = pendingCheckin(b); return p ? `<button class="add" data-act="checkin" style="color:var(--pine)">Payday check-in for ${fmtDate(D(p.snap.date))}</button>` : ""; })()}
    ${(()=>{ const ks = Object.keys(b.log||{}); if(!ks.length) return "";
        const last = b.log[ks.sort((x,y)=> (b.log[x].at<b.log[y].at?-1:1))[ks.length-1]];
        if(last.drift == null || Math.abs(last.drift) < 20) return "";
        return `<p class="sec-note" style="margin:10px 2px 0">Last check-in: ${money(Math.abs(last.drift))} ${last.drift<0?"behind":"ahead of"} plan. The plan now starts from your real balance.</p>`; })()}
    ${cs.length>2 && b.expenses.length>1 ? `<button class="add" data-act="evenOut">Even these out further</button>` : ""}
    ${PLAN.buffer>1?`<div class="flag watch" style="margin-top:12px"><h4><span>Keep a cushion in checking</span><em>${money(PLAN.buffer)}</em></h4>
      <p>Bills fall monthly, your pay doesn't, so some checks carry more than they earn${dry?" ("+dry+" of them above)":""}. Over the next three months the balance bottoms out ${money(PLAN.buffer)} below zero. Keeping that much parked in checking is what makes the plan work.</p></div>`:""}
    ${PLAN.unfunded.length ? `<div class="flag crit" style="margin-top:12px"><h4>Due before your next paycheck</h4>
      <p>${PLAN.unfunded.map(o=>esc(o.name)+" on "+fmtDate(o.due)).join(", ")} ${PLAN.unfunded.length>1?"fall":"falls"} due before ${fmtDate(cs[0].date)}, so ${PLAN.unfunded.length>1?"they're":"it's"} sitting on your next check. If you already covered ${PLAN.unfunded.length>1?"them":"it"} from your last paycheck, clear ${PLAN.unfunded.length>1?"them":"it"} out — the first check reads wrong until you do.</p>
      <button class="btn ghost" style="margin-top:11px" data-act="clearPastDue">I already paid ${PLAN.unfunded.length>1?"these":"this"}</button></div>`:""}
    ${cs.map(c=>checkCard(b,c)).join("")}
    <p class="sec-note" style="margin-top:18px">Bills move to the latest paycheck that still lands before their due date, then shift earlier when a check gets crowded. Tap any bill to pin it, mark it paid, or move it yourself.</p>`;
}
function checkCard(b,c){
  const segs = [];
  const w = v => c.income>0 ? Math.min(100, v/c.income*100) : 0;
  if(c.bills-c.debtBills>0) segs.push(`<span class="s-bill" style="width:${w(c.bills-c.debtBills)}%"></span>`);
  if(c.debtBills>0) segs.push(`<span class="s-debt" style="width:${w(c.debtBills)}%"></span>`);
  if(c.goalTotal+c.sinkTotal>0) segs.push(`<span class="s-goal" style="width:${w(c.goalTotal+c.sinkTotal)}%"></span>`);
  if(c.allowance>0) segs.push(`<span class="s-allow" style="width:${w(c.allowance)}%"></span>`);
  if(c.left<0) segs.push(`<span class="s-over" style="width:${Math.min(100,-c.left/c.income*100)}%"></span>`);
  const open = openChecks[c.id];
  const days = dayDiff(today(), c.date);
  const when = days===0 ? "Today" : days<0 ? Math.abs(days)+" days ago" : days<14 ? "In "+days+" days" : fmtMY(c.date);
  const rows = [];
  c.items.forEach(o=>{
    const paid = b.paid && b.paid[o.key];
    const tags = [];
    if(o.movedEarly) tags.push('<span class="pill moved">moved early</span>');
    if(o.pinned) tags.push('<span class="pill pin">pinned</span>');
    if(o.late) tags.push('<span class="pill late">past due</span>');
    rows.push(`<button class="item ${paid?'done':''}" data-item="${o.key}" data-check="${c.id}">
      <span class="tick ${paid?'done':''}"><svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6L4 7.5 10 1.3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="item-main"><span class="item-name">${esc(o.name)}</span>
        <span class="item-sub"><i style="width:7px;height:7px;border-radius:2px;background:${catOf(o.cat).color};display:inline-block"></i>due ${fmtDate(o.due)} ${tags.join(" ")}</span></span>
      <span class="item-amt">${money(o.amount)}</span></button>`);
  });
  c.sinking.forEach(s=>{
    rows.push(`<div class="item"><span class="tick" style="border-style:dashed"></span>
      <span class="item-main"><span class="item-name">${esc(s.name)} — set aside</span>
      <span class="item-sub">banked toward the ${fmtDate(s.due)} payment</span></span>
      <span class="item-amt">${money(s.amount)}</span></div>`);
  });
  (c.goals||[]).forEach(g=>{ if(g.per<=0) return;
    const gk = goalKey(g.id, c.id), gdone = !!paidRec(b, gk);
    rows.push(`<button class="item ${gdone?'done':''}" data-goaltick="${g.id}" data-check="${c.id}" data-amt="${g.per}">
      <span class="tick ${gdone?'done':''}" style="${gdone?'border-color:var(--violet);background:var(--violet)':'border-color:var(--violet)'}">
        <svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6L4 7.5 10 1.3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="item-main"><span class="item-name">${esc(g.name)}</span><span class="item-sub">${g.type==="debt"?"extra toward debt":"into savings"}${gdone?" · added":""}</span></span>
      <span class="item-amt">${money(g.per)}</span></button>`);
  });
  (c.buckets||[]).forEach(x=>{ if(!(+x.amount>0)) return;
    rows.push(`<button class="item" data-act="editBucket" data-id="${x.id}">
      <span class="tick" style="border-color:${catOf(x.cat).color};background:${catOf(x.cat).color};color:#fff">
        <svg width="11" height="9" viewBox="0 0 11 9"><circle cx="5.5" cy="4.5" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></span>
      <span class="item-main"><span class="item-name">${esc(x.name)}</span><span class="item-sub">spending money, no due date</span></span>
      <span class="item-amt">${money(x.amount)}</span></button>`);
  });
  (c.flex||[]).forEach(f=>{
    rows.push(`<div class="item"><span class="tick" style="border-color:${f.type==="debt"?"var(--clay)":"var(--violet)"};background:${f.type==="debt"?"var(--clay)":"var(--violet)"};color:#fff">
      <svg width="11" height="9" viewBox="0 0 11 9"><path d="M5.5 1v7M2 4.5h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <span class="item-main"><span class="item-name">${esc(f.name)}</span>
        <span class="item-sub">${f.type==="debt"?"extra toward debt":"savings"} · what this check could spare${f.fills?" · finishes it":""}</span></span>
      <span class="item-amt">${money(f.amount)}</span></div>`);
  });
  if(c.debtExtra>0) rows.push(`<div class="item"><span class="tick" style="border-color:var(--clay);background:var(--clay);color:#fff">
    <svg width="11" height="9" viewBox="0 0 11 9"><path d="M2 4.5h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
    <span class="item-main"><span class="item-name">Extra toward debt</span><span class="item-sub">above the minimums, on your payoff plan</span></span>
    <span class="item-amt">${money(c.debtExtra)}</span></div>`);
  if(c.free>0) rows.push(`<div class="item"><span class="tick" style="border-color:var(--steel);background:var(--steel);color:#fff">
    <svg width="11" height="9" viewBox="0 0 11 9"><circle cx="5.5" cy="4.5" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></span>
