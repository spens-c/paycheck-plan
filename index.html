    <span class="item-amt">${money(c.free)}</span></div>`);
  return `<article class="check ${open?'open':''} ${c.date<today()?'past':''}" id="chk-${c.id}">
    <button class="check-head" data-check-toggle="${c.id}">
      <span><span class="check-when">${when}${c.bonus?' · <b style="color:var(--pine)">EXTRA PAYCHECK</b>':""}</span><span class="check-date">${fmtLong(c.date)}</span></span>
      <span style="display:flex;align-items:center;gap:10px">
        <span class="check-amt"><span class="in">${money(c.income)} in</span>
          <span class="left ${c.dry?'neg':''}">${money(c.left)} ${c.left<0?"short":"left"}</span></span>
        <svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none"><path d="M1.5 1.5L6.5 6.5l-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </span>
    </button>
    <div class="bar">${segs.join("")}</div>
    <div class="check-meta">
      <span>Bills <b>${money(c.bills)}</b></span>
      ${c.sinkTotal>0?`<span>Set aside <b>${money(c.sinkTotal)}</b></span>`:""}
      ${c.goalTotal>0?`<span>Goals <b>${money(c.goalTotal)}</b></span>`:""}
      ${c.debtExtra>0?`<span>Extra debt <b>${money(c.debtExtra)}</b></span>`:""}
      ${c.flexTotal>0?`<span>Spare swept <b>${money(c.flexTotal)}</b></span>`:""}
      ${c.allowance>0?`<span>Spending <b>${money(c.allowance)}</b></span>`:""}
      <span>${Math.round(c.load*100)}% of this check</span>
      ${c.covered?`<span style="color:var(--amber)">covered by your cushion</span>`:""}
    </div>
    <div class="check-body">${rows.length?rows.join(""):'<div class="empty-check">Nothing due from this check.</div>'}</div>
  </article>`;
}

/* ---------- Money ---------- */
// a few sensible taps, scaled to the paycheck, always including whatever is set now
function quickAmounts(b, current){
  const pay = +b.pay.amount || 0;
  const base = pay > 0 ? [0, 0.05, 0.10, 0.15, 0.20].map(f=>Math.round(pay*f/10)*10)
                       : [0, 50, 100, 150, 200];
  const set = Array.from(new Set(base.concat([Math.round(+current||0)])))
    .filter(v=>v>=0).sort((x,y)=>x-y);
  return set.slice(0, 5);
}

function renderBills(b){
  const per = payPerYear(b);
  const byCat = {};
  const mine = b.expenses.filter(onBudget);
  const elsewhere = b.expenses.filter(e=>!onBudget(e));
  mine.forEach(e=>{ (byCat[e.cat] = byCat[e.cat]||[]).push(e); });
  const order = CATS.map(c=>c.id).filter(id=>byCat[id]);
  const list = order.map(cid=>{
    const c = catOf(cid);
    const tot = byCat[cid].reduce((s,e)=>s+monthlyCost(e),0);
    return `<h2 class="sec" style="font-size:15px;font-family:var(--sans);font-weight:600;display:flex;justify-content:space-between;align-items:baseline">
        <span>${c.name}</span><span class="num" style="font-size:14px;color:var(--ink3)">${money(tot)}/mo</span></h2>
      <div class="card">${byCat[cid].map(e=>expenseRow(b,e)).join("")}</div>`;
  }).join("");
  const split = mine.filter(e=>e.sinking);
  $("view-bills").innerHTML = `
    ${mine.length ? `<button class="add" style="margin-top:0" data-act="addExpense">+ Add a bill</button>` : ""}
    ${list || `<div class="empty"><h4>No bills yet</h4><p>Add your fixed bills with their due dates. The plan builds itself from there, and re-decides every time you change something.</p><button class="btn" data-act="addExpense">Add a bill</button></div>`}
    ${mine.length ? `<button class="add" data-act="addExpense">+ Add a bill</button>` : ""}
    ${elsewhere.length ? `<p class="sec-note" style="margin-top:18px">${elsewhere.map(e=>esc(e.name)).join(", ")} ${elsewhere.length>1?"are":"is"} paid from another account, so ${elsewhere.length>1?"they're":"it's"} not listed here. You'll find ${elsewhere.length>1?"them":"it"} on the Debt tab.</p>` : ""}
    ${split.length ? `<p class="sec-note" style="margin-top:18px">${split.map(e=>esc(e.name)).join(", ")} ${split.length===1?"is":"are"} set aside a piece at a time instead of coming out of one check. Tap a bill to change that, or anything else about it.</p>`
      : `<p class="sec-note" style="margin-top:18px">Tap any bill to change its amount, due date, frequency or category.</p>`}
    <div style="height:10px"></div>`;
}

function renderMoney(b){
  const per = payPerYear(b);
  const a = analyze(b, PLAN);
  const bon = bonusIncome(b);
  const fixedM = b.expenses.filter(onBudget).filter(e=>!SPEND_CATS.includes(e.cat) || e.freq!=="monthly")
                   .reduce((s,e)=>s+monthlyCost(e),0);
  const billsM = a.billsM;
  const flexM = (a.flexSaveM||0) + (a.flexDebtM||0);
  const outM = billsM + a.allowM + a.savingsM + (a.debtGoalM||0) + (a.extraM||0);
  const line = (label, val2, note, color) => `<div class="row">
      <span class="swatch" style="background:${color||"var(--line)"}"></span>
      <span class="row-main"><span class="row-title">${label}</span>
        ${note?`<span class="row-sub">${note}</span>`:""}</span>
      <span class="row-amt">${money(val2)}</span></div>`;

function expenseRow(b,e){

  let when = f.name;
  if(e.freq==="monthly") when = "Due the "+ordinal(e.dueDay||1);
  else if(e.dueDate) when = f.name+" · next "+fmtDate(D(e.dueDate));
  const tags = [];
  if(e.sinking) tags.push("split across checks");
  if(e.autopay) tags.push("autopay, can't move");

      <span class="row-sub">${when}${tags.length?" · "+tags.join(" · "):""}</span></span>
    <span class="row-amt">${money2(e.amount||0)}${f.perYear!==12?`<small>${money(monthlyCost(e))}/mo</small>`:""}</span></button>`;
}
const ordinal = n => n + (["th","st","nd","rd"][(n%100-20)%10] || ["th","st","nd","rd"][n%100] || "th");

/* ---------- Goals ---------- */
function renderGoals(b){
  const per = payPerYear(b);
  const flex = (b.goals||[]).filter(g=>g.flex);
  const fixed = (b.goals||[]).filter(g=>!g.flex);
  const avg = PLAN.flexAvg || {};
  const sav = fixed.filter(g=>g.type==="savings");
  const dbt = fixed.filter(g=>g.type==="debt");

  const goalMet = g => g.type==="savings" && (+g.target||0) > 0 && (+g.saved||0) >= (+g.target||0) - 0.5;
  const scheduleRows = (g) => {
    if(goalMet(g)) return `<div class="empty-check">Reached — ${money(g.saved)} of ${money(g.target)} is banked. Whatever this was taking now goes to the next goal down the list.</div>`;
    if(g.type==="debt" && debtOwed(b) <= 0) return `<div class="empty-check">Nothing left to pay off, so this one is idle. Spare money moves on to the next goal.</div>`;
    const sc = goalSchedule(b, g.id);
    if(!sc.rows.length) return `<div class="empty-check">Nothing is reaching this one yet — the goals above it are taking everything spare.</div>`;
    const shown = sc.rows.slice(0, 40);
    return `<div class="sched">${shown.map(r=>`<div class="sched-row${r.done?" done":""}">
        <span>${fmtSmart(r.date)}</span>
        <b>${money(r.amount)}</b>
        <em>${money(r.running)}${sc.target>0?" of "+money(sc.target):""}</em>
      </div>`).join("")}</div>
      <div class="sched-foot">${sc.met
        ? "Target reached on the " + fmtSmartShort(sc.met) + " paycheck, " + Math.max(1, Math.round(dayDiff(today(), sc.met)/30)) + " months from now."
        : sc.target>0
          ? "Still short at " + fmtDate(sc.rows[sc.rows.length-1].date) + ". Move it higher up the list to fill it sooner."
          : "No target set, so this keeps taking whatever the goals above it leave behind."}</div>`;
  };
  const flexCard = (g, i) => {
    const open = !!openGoals[g.id];
    const amounts = PLAN.checks.map(c=>(c.flex.find(f=>f.id===g.id)||{}).amount||0).filter(v=>v>0);
    const lo = amounts.length?Math.min(...amounts):0, hi = amounts.length?Math.max(...amounts):0;
    const done = g.type==="savings" && (+g.target||0)>0
      ? clamp((+g.saved||0)/(+g.target||1)*100,0,100) : 0;
    return `<div class="goal">
      <button data-goal-toggle="${g.id}" style="display:block;width:100%;text-align:left">
        <span class="goal-top"><span>
          <span class="goal-name">${esc(g.name)} <span class="pill" style="background:${goalMet(g)?"var(--pine-soft);color:var(--pine)":"#EFEAF7;color:var(--violet)"}">${goalMet(g)?"reached":"flexible"}</span></span>
          <span class="goal-when">${
            goalMet(g) ? money(g.target)+" banked — it's done"
            : g.type==="debt" ? "spare cash goes at your balances, in the payoff order"
            : (+g.target||0)>0 ? money(g.saved||0)+" of "+money(g.target)+" so far" : "no target — it just keeps filling"}</span></span>
          <span class="goal-per">
            <b>${goalMet(g) ? "Done" : (lo===hi?money(lo):money(lo)+"–"+money(hi))}</b>
            <small>${goalMet(g) ? "nothing more needed" : "per paycheck"+(lo===hi?"":", varies")}</small></span></span>
        ${g.type==="savings"&&(+g.target||0)>0?`<span class="track"><span style="width:${done}%;background:var(--violet)"></span></span>`:""}
        <span class="sched-more">${open?"Hide the schedule":"Show every payment until it's met"}
          <svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none" style="${open?"transform:rotate(90deg)":""}"><path d="M1.5 1.5L6.5 6.5l-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
      </button>
      ${open?scheduleRows(g):""}
      <div style="display:flex;gap:8px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line2)">
        <button class="row-sub" data-act="goalUp" data-id="${g.id}" ${i===0?"disabled style=\"opacity:.3;flex:1\"":'style="flex:1"'}>▲ higher</button>
        <button class="row-sub" data-act="goalDown" data-id="${g.id}" ${i===flex.length-1?"disabled style=\"opacity:.3;flex:1\"":'style="flex:1"'}>▼ lower</button>
        <button class="row-sub" data-act="editGoal" data-id="${g.id}" style="flex:1;color:var(--pine);font-weight:600">Edit</button>
      </div></div>`;
  };
  const card = g => {
    const open = !!openGoals[g.id];
    const p = goalPerCheck(b,g);
    const done = g.type==="savings" ? clamp((+g.saved||0)/Math.max(1,+g.target||1)*100,0,100) : 0;
    const end = goalEnd(b,g);
    const met = g.type==="savings" && (+g.saved||0) >= (+g.target||0) && (+g.target||0) > 0;
    const left = goalMonthsLeft(b,g);
    return `<div class="goal"><button data-goal-toggle="${g.id}" style="display:block;width:100%;text-align:left">
      <span class="goal-top"><span><span class="goal-name">${esc(g.name)}</span>
        <span class="goal-when">${money(g.target)} by ${fmtMY(end)} · ${met?"reached":left+" month"+(left===1?"":"s")+" to go"}${g.type==="debt"&&g.apr?" · "+g.apr+"% APR":""}</span></span>
        <span class="goal-per"><b>${met?"Done":money(p)}</b><small>${met?"target met":"per check"}</small></span></span>
      ${g.type==="savings"?`<span class="track"><span style="width:${done}%;background:var(--violet)"></span></span>
        <span class="goal-foot"><span>${money(g.saved||0)} saved</span><span>${money(Math.max(0,(g.target||0)-(g.saved||0)))} to go</span></span>`
        :`<span class="track"><span style="width:100%;background:var(--clay);opacity:.35"></span></span>
        <span class="goal-foot"><span>${money(monthlyOf(b,p))} a month</span><span>flows into your Debt plan</span></span>`}
      <span class="sched-more">${open?"Hide the schedule":"Show every payment until it's met"}
        <svg class="chev" width="8" height="13" viewBox="0 0 8 13" fill="none" style="${open?"transform:rotate(90deg)":""}"><path d="M1.5 1.5L6.5 6.5l-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
    </button>
    ${open?scheduleRows(g):""}
    <div style="margin-top:11px;padding-top:11px;border-top:1px solid var(--line2)">
      <button class="row-sub" data-act="editGoal" data-id="${g.id}" style="color:var(--pine);font-weight:600">Edit this goal</button>
    </div></div>`;
  };
  const fixedTotal = fixed.reduce((s,g)=>s+goalPerCheck(b,g),0);
  const flexTotal = flex.reduce((s,g)=>s+(avg[g.id]||0),0);

  $("view-goals").innerHTML = `
    ${(b.goals||[]).length?`<div class="card" style="padding:15px 16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:14px;font-weight:600">Going to goals</span>
        <span class="num" style="font-size:22px">${money(monthlyOf(b, fixedTotal) + flexTotal)}</span></div>
      <div class="row-sub" style="margin-top:3px">a month${fixedTotal>0&&flexTotal>0?` — ${money(monthlyOf(b, fixedTotal))} committed, ${money(flexTotal)} from whatever's spare`:flexTotal>0?", all of it from whatever each check can spare":""}. Open any goal to see exactly what lands in it, and when.</div>
    </div>`:""}

    <h2 class="sec">Flexible goals</h2>
    <p class="sec-note">No deadline and no fixed amount. Each paycheck covers its bills and your spending money first, then whatever's left runs down this list in order until it's gone. A bill-heavy check simply gives less. If you want more held back for yourself, raise your spending money on the Money tab.</p>
    ${flex.length ? flex.map(flexCard).join("")
      : `<div class="empty"><h4>Let the app decide</h4>
          <p>Tell it what matters and it works out how much each paycheck can spare, check by check. Nothing to calculate, and no goal that quietly breaks your budget.</p>
          <button class="btn" data-act="autoGoals">Set this up for me</button></div>`}
    ${flex.length?`<button class="add" data-act="addFlexGoal">+ Add a flexible goal</button>`:""}

    <h2 class="sec">Fixed goals</h2>
    <p class="sec-note">For anything with a real deadline. These take their amount before the flexible ones get a look in.</p>
    ${sav.length||dbt.length ? [...sav,...dbt].map(card).join("")
      : `<p class="sec-note" style="color:var(--ink3)">None set. Most people don't need any.</p>`}
    <button class="add" data-act="addGoal" data-type="savings">+ Add a savings goal with a deadline</button>
    <button class="add" data-act="addGoal" data-type="debt">+ Add a debt payoff goal with a deadline</button>
    <div style="height:10px"></div>`;
}

/* ---------- Debt ---------- */
function debtRow(b, e){
  const c = catOf(e.cat);
  const bal = +e.balance||0, apr = +e.apr||0;
  // never filled in is not the same thing as paid off
  const missing = bal <= 0 && apr <= 0;
  const cleared = bal <= 0 && !missing;
  const left = +e.paymentsLeft||0;
  let when = (e.freq||"monthly")==="monthly" ? "minimum "+money2(e.amount||0)+" on the "+ordinal(e.dueDay||1)
             : "minimum "+money2(e.amount||0)+" "+((FREQS.find(f=>f.id===e.freq)||{}).name||"").toLowerCase();
  if(left > 0) when = left+" payments of "+money2(e.amount||0)+" left";
  if(e.offBudget) when += " · paid from another account";
  return `<button class="row" data-act="editDebt" data-id="${e.id}">
    <span class="swatch" style="background:${cleared?'var(--line)':c.color}"></span>
    <span class="row-main"><span class="row-title">${esc(e.name)}
      ${cleared?'<span class="pill" style="background:var(--pine-soft);color:var(--pine)">paid off</span>':""}</span>
      <span class="row-sub">${missing ? "tap to add the balance and rate" : (cleared ? when : apr.toFixed(2).replace(/\.00$/,"")+"% APR · "+when)}</span></span>
    <span class="row-amt">${missing?"—":money(bal)}<small>${missing?"not set":cleared?"cleared":"owed"}</small></span></button>`;
}
function renderDebt(b){
  const s = debtSummary(b, PLAN);
  const all = (b.expenses||[]).filter(e => e.cat==="creditcard" || e.cat==="loan");
  const listing = all.length ? `
    <div class="card">${all.map(e=>debtRow(b,e)).join("")}</div>
    <button class="add" data-act="addDebt">+ Add another card or loan</button>` : "";
  if(!all.length){
    $("view-debt").innerHTML = `<div class="empty"><h4>No debt entered</h4>
      <p>Add each card or loan with its balance, rate and minimum payment. They show up in your bills too, and the payoff plan builds itself here.</p>
      <button class="btn" data-act="addDebt">Add a card or loan</button></div>`;
    return;
  }
  if(!s.debts.length){
    const blank = all.filter(e => (+e.balance||0) <= 0 && (+e.apr||0) <= 0);
    $("view-debt").innerHTML = `${listing}
      ${blank.length ? `<div class="flag watch" style="margin-top:14px"><h4>Needs a balance and a rate</h4>
        <p>${blank.map(e=>esc(e.name)).join(", ")} ${blank.length>1?"are":"is"} being paid as a bill, but without the balance owed and the interest rate there's nothing to build a payoff plan from. Tap ${blank.length>1?"each one":"it"} above to fill those in.</p></div>`
      : `<div class="flag good" style="margin-top:14px"><h4>Nothing left to pay down</h4>
        <p>Every card and loan here has a zero balance. If that's right, remove the payments under Bills so the plan stops holding money back for them.</p></div>`}`;
    return;
  }
  const snow = simulate(s.debts, s.extra, "snowball");
  const aval = simulate(s.debts, s.extra, "avalanche");
  const both = [snow, aval];
  const valid = both.every(r=>!r.stuck && isFinite(r.months));
  let rec = "avalanche", why = "";
  if(valid){
    const saves = snow.interest - aval.interest;
    const faster = snow.months - aval.months;
    if(saves < 50 && faster <= 1){ rec="snowball"; why = `Avalanche only saves ${money(saves)} here, which isn't worth much. Snowball clears your smallest balance first, and that early win is what keeps people going.`; }
    else { rec="avalanche"; why = `Avalanche saves ${money(saves)} in interest${faster>0?` and finishes ${faster} month${faster>1?"s":""} sooner`:""}. With a gap that size, take the math.`; }
  }
  const R = rec==="avalanche" ? aval : snow;
  const O = rec==="avalanche" ? snow : aval;
  const target = R.order.find(d=>d.paidMonth) || R.order[0];
  const payoffDate = m => fmtMY(addMonths(today(), m));
  const strat = (name, res, isRec) => `<div class="card" style="padding:15px 16px;${isRec?'box-shadow:var(--shadow),0 0 0 2px var(--pine)':''}">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-weight:600;font-size:15px">${name}${isRec?' <span class="pill" style="background:var(--pine-soft);color:var(--pine)">recommended</span>':''}</span>
        <span class="num" style="font-size:20px">${isFinite(res.months)?res.months+" mo":"—"}</span></div>
      <div class="row-sub" style="margin-top:4px">${isFinite(res.months)?`Debt-free ${payoffDate(res.months)} · ${money(res.interest)} total interest`:"Minimum payments don't cover the interest at this rate"}</div>
      <div class="row-sub" style="margin-top:6px;color:var(--ink2)">${name==="Avalanche"?"Highest interest rate first":"Smallest balance first"}</div>
    </div>`;
  const hist = paymentHistory(b).slice(0, 10);
  const postedNote = LAST_POSTED.length ? `
    <div class="flag good" style="margin-top:14px"><h4><span>${LAST_POSTED.length} payment${LAST_POSTED.length>1?"s":""} posted since you last looked</span>
      <em>${money(LAST_POSTED.reduce((t,x)=>t+Math.abs(x.delta),0))}</em></h4>
      <p>${LAST_POSTED.slice(0,4).map(x=>esc(x.name)+" "+money(x.amount)+(x.extra?" extra":"")).join(", ")}${LAST_POSTED.length>4?" and "+(LAST_POSTED.length-4)+" more":""}. Balances above are updated. If any of that isn't what actually left your account, correct it below.</p></div>` : "";
  $("view-debt").innerHTML = `
    ${listing}
    ${postedNote}
    ${s.offMin>0?`<p class="sec-note" style="margin-top:14px">${money(s.offMin)} a month of these minimums comes out of another account, so it isn't taken from these paychecks. It's still counted in the payoff maths below.</p>`:""}
    <h2 class="sec">Paying it down</h2>
    <p class="sec-note">Your minimums are already covered — ${money(s.totalMin - s.offMin)} a month sits in your bills${s.offMin>0?" and "+money(s.offMin)+" comes from elsewhere":""}. This is only about what goes in on top.</p>
    <div class="card" style="padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <span style="font-weight:600;font-size:15px">Extra above the minimums</span>
        <span class="num" style="font-size:22px">${money(s.committed)}</span></div>
      <div class="row-sub">Reserved from every paycheck, on top of what's already budgeted.
        ${s.headroom>0?`You have about ${money(s.headroom)} a month spare to draw on.`

function spendBars(b, a){
  const groups = {};
  b.expenses.forEach(e=>{ const g = catOf(e.cat); groups[g.id] = (groups[g.id]||0) + monthlyCost(e); });

  if(a.allowM>0) rows.push(["_allow", a.allowM]);
  if(a.savingsM>0) rows.push(["_save", a.savingsM]);
  if(a.leftM>0) rows.push(["_left", a.leftM]);
  const max = Math.max(...rows.map(r=>r[1]), 1);
  const label = id => id==="_allow"?"Spending allowance": id==="_save"?"Savings goals": id==="_left"?"Unassigned": catOf(id).name;

}
function compareTable(b, others){

/* ============================================================
   The ledger: making a tick actually move a balance
   ============================================================ */
function paidRec(b, key){
  const r = b.paid && b.paid[key];
  if(!r) return null;
  return r === true ? { on:true, delta:0, amount:0 } : r;
}
const isDebtCat = c => c==="creditcard" || c==="loan";

// Interest accrued on a card between one payment and the next. A $95 payment on
// $4,200 at 25% moves the balance about $8, and the app should say so.
function accrued(e){
  const f = FREQS.find(x=>x.id===(e.freq||"monthly")) || FREQS[0];
  const months = f.perYear > 0 ? 12/f.perYear : 1;
  return (+e.balance||0) * (+e.apr||0)/100/12 * months;
}
function setPaid(b, occ, on, actualBalance){
  b.paid = b.paid || {};
  const e = b.expenses.find(x=>x.id===occ.eid);
  if(on){
    if(b.paid[occ.key]) return paidRec(b, occ.key);
    let delta = 0, interest = 0;
    if(e && isDebtCat(e.cat) && (+e.balance||0) > 0){
      interest = accrued(e);
      const before = +e.balance||0;
      // round first, then take the delta from the rounded figure, so unticking
      // restores the balance to the cent instead of drifting
      const after = Math.round(Math.max(0, (actualBalance != null && actualBalance !== "")
        ? +actualBalance
        : before + interest - (+occ.amount||0)) * 100) / 100;
      delta = Math.round((after - before)*100)/100;
      e.balance = after;
    }
    b.paid[occ.key] = { on:true, delta, interest, eid:occ.eid, amount:+occ.amount||0, at:iso(today()) };
    return b.paid[occ.key];
  }
  const r = paidRec(b, occ.key);
  if(r && r.delta && e) e.balance = Math.max(0, Math.round(((+e.balance||0) - r.delta)*100)/100);
  if(b.paid) delete b.paid[occ.key];
  return null;
}
const goalKey = (gid, checkId) => "goal:" + gid + "@" + checkId;
// where a flexible "attack my debt" contribution actually lands: the priciest balance
function nextDebtTarget(b){
  const live = (b.expenses||[])
    .filter(e => (e.cat==="creditcard"||e.cat==="loan") && (+e.balance||0) > 0)
    .sort((x,y)=> (+y.apr||0)-(+x.apr||0) || (+x.balance||0)-(+y.balance||0));
  return live[0] || null;
}
function setGoalPaid(b, gid, checkId, amount, on, targetEid){
  b.paid = b.paid || {};
  const key = goalKey(gid, checkId);
  const g = (b.goals||[]).find(x=>x.id===gid);
  if(!g) return;
  if(on){
    if(b.paid[key]) return;
    let delta = 0;
    if(g.type==="savings"){
      g.saved = Math.round(((+g.saved||0) + (+amount||0))*100)/100;
    } else if(targetEid){
      // extra money above the minimum comes straight off that balance
      const e = (b.expenses||[]).find(x=>x.id===targetEid);
      if(e){
        const before = +e.balance||0;
        const after = Math.round(Math.max(0, before - (+amount||0))*100)/100;
        delta = Math.round((after - before)*100)/100;
        e.balance = after;
      }
    }
    b.paid[key] = { on:true, goal:gid, amount:+amount||0, eid:targetEid, delta, at:iso(today()) };
  } else {
    const r = paidRec(b, key);
    if(r && g.type==="savings") g.saved = Math.max(0, Math.round(((+g.saved||0) - (+r.amount||0))*100)/100);
    if(r && r.delta && r.eid){
      const e = (b.expenses||[]).find(x=>x.id===r.eid);
      if(e) e.balance = Math.max(0, Math.round(((+e.balance||0) - r.delta)*100)/100);
    }
    delete b.paid[key];
  }
}

/* ---------- snapshots ----------
   What a paycheck was planned to cover, frozen at the time. Without this a
   check-in two days late would have nothing to check in against, because the
   plan only ever generates bills from today forward. */
function snapshot(b, plan){
  if(!plan.checks.length) return;
  b.snaps = b.snaps || {}; b.log = b.log || {};
  let dirty = false;
  plan.checks.slice(0,2).forEach(c=>{
    if(b.log[c.id]) return;                       // already confirmed, leave it alone
    const snap = {
      date: iso(c.date), income: c.income, allowance: c.allowance, debtExtra: c.debtExtra||0,
      items: c.items.map(o=>({ key:o.key, eid:o.eid, name:o.name, cat:o.cat, amount:o.amount, due:iso(o.due) })),
      goals: [
        ...(c.goals||[]).filter(g=>g.per>0).map(g=>({ id:g.id, name:g.name, type:g.type, amount:g.per })),
        ...(c.flex||[]).map(f=>{
          const t = f.type==="debt" ? nextDebtTarget(b) : null;
          return { id:f.id, name:f.name, type:f.type, amount:f.amount,
                   targetEid: t?t.id:undefined, targetName: t?t.name:undefined };
        })
      ],
      sink: c.sinking.map(x=>({ name:x.name, amount:x.amount })),
      expected: c.left
    };
    if(JSON.stringify(b.snaps[c.id]) !== JSON.stringify(snap)){ b.snaps[c.id] = snap; dirty = true; }
  });
  // don't let old snapshots pile up forever
  const cut = iso(addMonths(today(), -8));
  Object.keys(b.snaps).forEach(k=>{ if(b.snaps[k].date < cut){ delete b.snaps[k]; dirty = true; } });
  return dirty;
}
function pendingCheckin(b){
  if(!b.snaps) return null;
  const t = iso(today());
  const due = Object.keys(b.snaps)
    .filter(k => b.snaps[k].date <= t && !(b.log||{})[k])
    .sort((a,c)=> b.snaps[a].date < b.snaps[c].date ? -1 : 1);
  return due.length ? { id:due[0], snap:b.snaps[due[0]] } : null;
}

/* ---------- the check-in screen ---------- */
let CI = null;
function openCheckin(id){
  const b = B();
  const snap = (b.snaps||{})[id];
  if(!snap) return;
  CI = { id, snap, ticks:{}, balances:{} };
  snap.items.forEach(o=>{ CI.ticks[o.key] = !paidRec(b, o.key) ? true : true; });
  snap.goals.forEach(g=>{ CI.ticks[goalKey(g.id, id)] = true; });
  drawCheckin();
}
function drawCheckin(){
  const b = B(), s = CI.snap;
  const row = (key, name, sub, amount, extra) => `
    <button class="item" data-ci="${key}">
      <span class="tick ${CI.ticks[key]?'done':''}"><svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6L4 7.5 10 1.3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="item-main"><span class="item-name">${esc(name)}</span>
        <span class="item-sub">${sub}</span></span>
      <span class="item-amt">${money(amount)}</span></button>${extra||""}`;
  const bills = s.items.map(o=>{
    const e = b.expenses.find(x=>x.id===o.eid);
    let sub = "was due " + fmtDate(D(o.due));
    let extra = "";
    if(e && isDebtCat(e.cat) && (+e.balance||0) > 0 && CI.ticks[o.key]){
      const int = accrued(e);
      const proj = Math.max(0, (+e.balance||0) + int - o.amount);
      sub = money(int)+" of this is interest";
      extra = `<div style="padding:0 16px 13px 48px">
        <div class="row-sub" style="margin-bottom:6px">Balance ${money(e.balance)} → <b>${money(proj)}</b> after this payment.</div>
        <div class="money-in"><input type="number" inputmode="decimal" id="ci-bal-${o.eid}" step="0.01"
          value="${CI.balances[o.eid]!=null?CI.balances[o.eid]:""}" placeholder="or type the real balance"></div></div>`;
    }
    return row(o.key, o.name, sub, o.amount, extra);
  }).join("");
  const goals = s.goals.map(g=>row(goalKey(g.id, CI.id), g.name,
    g.type==="savings" ? "into savings"
      : (g.targetName ? "extra toward "+esc(g.targetName) : "extra toward debt"), g.amount)).join("");
  const sink = s.sink.length ? `<div class="row"><span class="row-main">
      <span class="row-title">${s.sink.map(x=>esc(x.name)).join(", ")} set aside</span>
      <span class="row-sub">stays in checking until it's due</span></span>
      <span class="row-amt">${money(s.sink.reduce((a,x)=>a+x.amount,0))}</span></div>` : "";
  $("obRoot").innerHTML = `<div class="ob"><div class="ob-in">
    <div class="ob-bar"><span style="width:100%"></span></div>
    <div class="ob-body">
      <div class="ob-step">Payday check-in</div>
      <h1>${fmtLong(D(s.date))}</h1>
      <p>Here's what this paycheck was set to cover. Untick anything that didn't happen, then confirm.</p>
      <h2 class="sec" style="font-size:15px;font-family:var(--sans)">Bills</h2>
      <div class="card">${bills || '<div class="empty-check">Nothing was due from this check.</div>'}</div>
      ${goals?`<h2 class="sec" style="font-size:15px;font-family:var(--sans)">Goals</h2><div class="card">${goals}</div>`:""}
      ${sink?`<h2 class="sec" style="font-size:15px;font-family:var(--sans)">Set aside</h2><div class="card">${sink}</div>`:""}
      <h2 class="sec" style="font-size:15px;font-family:var(--sans)">Reality check</h2>
      <p class="sec-note">Optional. If the number's off, it's better to know now than in March.</p>
      <label class="f"><span>What's in checking today?</span>
        <div class="money-in"><input type="number" inputmode="decimal" id="ciActual" step="0.01"
          value="${CI.actual!=null?CI.actual:""}" placeholder="0.00"></div>
        <div class="hint">The plan expected about ${money(s.expected + (+b.startBalance||0))} left after this check.</div></label>
    </div>
    <div class="ob-foot"><div class="two">
      <button class="btn ghost" id="ciSkip">Skip</button>
      <button class="btn" id="ciDone">Confirm</button>
    </div></div></div></div>`;
  $("obRoot").querySelectorAll("[data-ci]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const k = el.dataset.ci;
      CI.balances = readBalances();
      CI.actual = val("ciActual");
      CI.ticks[k] = !CI.ticks[k];
      drawCheckin();
    });
  });
  $("ciSkip").addEventListener("click", ()=>{ CI=null; $("obRoot").innerHTML=""; render(); });
  $("ciDone").addEventListener("click", confirmCheckin);
}
function readBalances(){
  const out = {};
  $("obRoot").querySelectorAll("input[id^='ci-bal-']").forEach(el=>{
    if(el.value !== "") out[el.id.replace("ci-bal-","")] = el.value;
  });
  return out;
}
function confirmCheckin(){
  const b = B(), s = CI.snap;
  const bals = readBalances();
  const actual = val("ciActual");
  s.items.forEach(o=>{
    const on = !!CI.ticks[o.key];
    if(on) setPaid(b, o, true, bals[o.eid]);
    else setPaid(b, o, false);
  });
  s.goals.forEach(g=> setGoalPaid(b, g.id, CI.id, g.amount,
    !!CI.ticks[goalKey(g.id, CI.id)], g.targetEid));
  b.log = b.log || {};
  const expected = s.expected + (+b.startBalance||0);
  const rec = { at: iso(today()), expected };
  if(actual !== ""){
    rec.actual = +actual;
    rec.drift = +actual - expected;
    b.startBalance = +actual;      // reality wins: re-base the plan on the real number
  }
  b.log[CI.id] = rec;
  const drift = rec.drift;
  CI = null; $("obRoot").innerHTML = "";
  save(); render();
  if(drift == null) toast("Logged — balances updated");
  else if(Math.abs(drift) < 20) toast("Logged — you're right on plan");
  else toast("Logged — you're " + money(Math.abs(drift)) + (drift<0 ? " behind plan" : " ahead of plan"));
}

/* ============================================================
   Posting payments as their due dates pass
   The assumption is simple: a minimum payment on a due date got made, and the
   extra you committed went at the payoff target. Both are recorded, both are
   reversible, and both can be corrected to whatever you actually paid.
   ============================================================ */
const XKEY = (eid, ym) => "xtra:" + eid + "@" + ym;
const ym = d => iso(d).slice(0,7);

function occurrencesFor(b, e, from, to){
  const solo = { ...b, expenses:[e], goals:[] };
  return genOccurrences(solo, to, from).filter(o => o.due >= from && o.due <= to);
}
function applyExtra(b, key, eid, amount){
  const e = (b.expenses||[]).find(x=>x.id===eid);
  if(!e || amount <= 0) return null;
  const before = +e.balance||0;
  if(before <= 0) return null;
  const after = Math.round(Math.max(0, before - amount)*100)/100;
  const delta = Math.round((after - before)*100)/100;
  e.balance = after;
  b.paid = b.paid || {};
  b.paid[key] = { on:true, delta, interest:0, eid, amount, auto:true, extra:true, at:iso(today()) };
  return b.paid[key];
}
function monthlyExtraTotal(b, plan){
  const s = debtSummary(b, plan);
  return s.extra;
}
function autoPostPayments(b, plan){
  const posted = [];
  if(b.autoPost === false) return posted;
  // a budget that has never posted starts from today: never invent back history
  if(!b.lastPost){ b.lastPost = iso(today()); return posted; }
  const to = addDays(today(), -1);                       // only due dates already past
  let from = D(b.lastPost);
  const floor = addMonths(today(), -24);
  if(from < floor) from = floor;
  if(to < from){ return posted; }

  // 1. the minimum on each debt, on each due date that has gone by
  (b.expenses||[])
    .filter(e => isDebtCat(e.cat) && (+e.balance||0) > 0 && (+e.amount||0) > 0)
    .forEach(e => {
      occurrencesFor(b, e, from, to).forEach(o => {
        if(paidRec(b, o.key)) return;
        const rec = setPaid(b, o, true);
        if(rec){ rec.auto = true;
          posted.push({ key:o.key, name:e.name, when:iso(o.due), amount:o.amount,
                        interest:rec.interest||0, delta:rec.delta||0, eid:e.id }); }
      });
    });

  // 2. the extra you committed, once for each month that has fully passed
  const extraM = monthlyExtraTotal(b, plan);
  if(extraM > 0.5){
    let m = new Date(from.getFullYear(), from.getMonth(), 1);
    const lastFull = new Date(to.getFullYear(), to.getMonth(), 1);
    let guard = 0;
    while(m <= lastFull && guard++ < 30){
      const monthEnd = new Date(m.getFullYear(), m.getMonth()+1, 0);
      if(monthEnd <= to){
        const target = nextDebtTarget(b);
        if(target){
          const key = XKEY(target.id, ym(m));
          if(!paidRec(b, key)){
            const rec = applyExtra(b, key, target.id, extraM);
            if(rec) posted.push({ key, name:target.name, when:iso(monthEnd), amount:extraM,
                                  interest:0, delta:rec.delta, eid:target.id, extra:true });
          }
        }
      }
      m = addMonths(m, 1);
    }
  }
  b.lastPost = iso(today());
  return posted;
}
function paymentHistory(b){
  const out = [];
  Object.keys(b.paid||{}).forEach(k=>{
    const r = paidRec(b, k);
    if(!r || !r.eid || !r.delta) return;
    const e = (b.expenses||[]).find(x=>x.id===r.eid);
    if(!e) return;
    const stamp = k.indexOf("xtra:")===0 ? (k.split("@")[1]||"") : (k.split("@")[1]||r.at||"");
    out.push({ key:k, name:e.name, when:stamp, amount:+r.amount||0,
               interest:+r.interest||0, delta:+r.delta||0, extra:!!r.extra, auto:!!r.auto });
  });
  return out.sort((a,b2)=> a.when < b2.when ? 1 : a.when > b2.when ? -1 : 0);
}
function correctPayment(b, key, actual){
  const r = paidRec(b, key);
  if(!r) return;
  const e = (b.expenses||[]).find(x=>x.id===r.eid);
  if(!e) return;
  const pre = Math.round(((+e.balance||0) - r.delta)*100)/100;   // balance before this payment
  const after = Math.round(Math.max(0, pre + (r.interest||0) - Math.max(0, actual))*100)/100;
  e.balance = after;
  r.delta = Math.round((after - pre)*100)/100;
  r.amount = Math.max(0, actual);
  r.corrected = true;
  b.paid[key] = r;
}

/* ============================================================
   Projections for the expandable views
   ============================================================ */
function goalSchedule(b, goalId){
  const g = (b.goals||[]).find(x=>x.id===goalId);
  if(!g) return { rows:[], met:null };
  // look further ahead than the plan horizon so a goal can actually finish
  const long = Object.assign({}, b, { horizon: Math.max(+b.horizon||6, 36) });
  const p = buildPlan(long);
  const rows = []; let running = g.type==="savings" ? (+g.saved||0) : 0;
  let met = null;
  for(const c of p.checks){
    let amount = 0;
    if(g.flex){ const f = (c.flex||[]).find(x=>x.id===goalId); amount = f ? f.amount : 0; }
    else { const gg = (c.goals||[]).find(x=>x.id===goalId); amount = gg ? gg.per : 0; }
    if(amount <= 0.005) continue;
    running += amount;
    const target = +g.target||0;
    const done = target > 0 && running >= target - 0.5;
    rows.push({ date:c.date, amount, running, done });
    if(done && !met){ met = c.date; break; }
  }
  return { rows, met, target:+g.target||0, horizonEnd: p.checks.length ? p.checks[p.checks.length-1].date : null };
}
function debtSchedule(b, plan, eid){
  const s = debtSummary(b, plan);
  const e = (b.expenses||[]).find(x=>x.id===eid);
  if(!e) return null;
  const snow = simulate(s.debts, s.extra, "snowball");
  const aval = simulate(s.debts, s.extra, "avalanche");
  const saves = snow.interest - aval.interest, faster = snow.months - aval.months;
  const useAval = !(saves < 50 && faster <= 1);
  const res = useAval ? aval : snow;
  const d = res.order.find(x=>x.id===eid) || res.order[0];
  // which paycheck funds the minimum, for the months the plan already covers
  const funded = [];
  plan.checks.forEach(c => c.items.forEach(o=>{
    if(o.eid === eid) funded.push({ check:c.date, due:o.due, amount:o.amount });
  }));
  return { debt:d, method: useAval ? "avalanche" : "snowball", res, funded,
           offBudget: !!e.offBudget, extra: s.extra };
}

/* ============================================================
   Sharing a budget
   Nothing is stored on a server, so a shared budget travels inside the link
   itself. That means the plain app URL carries no data at all: anyone you send
   it to gets an empty app.
   ============================================================ */
const B64 = {
  enc(bytes){ let s = ""; for(let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  dec(str){ const s = atob(str.replace(/-/g,"+").replace(/_/g,"/"));
    const out = new Uint8Array(s.length);
    for(let i=0;i<s.length;i++) out[i] = s.charCodeAt(i);
    return out; }
};
async function gzipStr(str){
  if(typeof CompressionStream === "undefined") return null;
  try{
    const cs = new CompressionStream("gzip");
    const w = cs.writable.getWriter();
    w.write(new TextEncoder().encode(str)).catch(()=>{});
    w.close().catch(()=>{});
    return new Uint8Array(await new Response(cs.readable).arrayBuffer());
  }catch(e){ return null; }
}
async function gunzipBytes(bytes){
  const ds = new DecompressionStream("gzip");
  const w = ds.writable.getWriter();
  // a corrupt link makes these reject on their own; swallow so it surfaces once, below
  w.write(bytes).catch(()=>{});
  w.close().catch(()=>{});
  return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
}
function shareableCopy(b){
  const c = JSON.parse(JSON.stringify(b));
  delete c.snaps; delete c.log;          // your check-in history stays yours
  c.sharedAt = iso(today());
  c.sharedName = b.name;
  return c;
}
async function buildShareLink(b){
  if(!b.shareId){ b.shareId = uid() + uid(); save(); }
  const json = JSON.stringify(shareableCopy(b));
  const gz = await gzipStr(json);
  const payload = gz ? "1" + B64.enc(gz)
                     : "0" + B64.enc(new TextEncoder().encode(json));
  const base = (typeof location !== "undefined" ? location.href.split("#")[0] : "");
  return base + "#b=" + payload;
}
async function readShareLink(hash){
  const raw = String(hash||"").replace(/^#b=/, "");
  if(!raw) return null;
  try{
    const mode = raw[0], data = B64.dec(raw.slice(1));
    const json = mode === "1" ? await gunzipBytes(data) : new TextDecoder().decode(data);
    const inc = JSON.parse(json);
    if(!inc || !inc.pay || !Array.isArray(inc.expenses)) return null;
    return inc;
  }catch(e){ return null; }
}

/* ---------- receiving ---------- */
async function takeIncomingShare(){
  if(typeof location === "undefined" || !location.hash || location.hash.indexOf("#b=") !== 0) return null;
  const inc = await readShareLink(location.hash);
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  return inc;
}
function showImportSheet(inc, onDone){
  const per = (PAYF.find(f=>f.id===inc.pay.freq)||PAYF[0]).name.toLowerCase();
  const mine = store.budgets.find(x=>x.shareId && x.shareId === inc.shareId);
  const goals = (inc.goals||[]).length, bills = (inc.expenses||[]).length;
  const spend = (+inc.allowance||0) + (inc.buckets||[]).reduce((s,x)=>s+(+x.amount||0),0);
  openSheet(mine ? "Updated budget received" : "A budget was shared with you", `
    <div class="card" style="margin-top:14px;padding:15px 16px">

    </div>

      <button class="btn ghost" data-act="shareAdd">Keep both, add as a copy</button>`
    : `<p class="sec-note" style="margin-top:16px">This adds it to your app as its own budget. Editing it afterwards only changes your copy — it doesn't send anything back.</p>
      <button class="btn" style="margin-top:8px" data-act="shareAdd">Add this budget</button>`}
    <button class="btn ghost" data-act="shareSkip">No thanks</button>`, null);
  PENDING_SHARE = { inc, mine, onDone };
}
let PENDING_SHARE = null;
function applyShare(mode){
  const ps = PENDING_SHARE; if(!ps) return;
  const { inc, mine, onDone } = ps;
  PENDING_SHARE = null;
  if(mode !== "skip"){
    const copy = JSON.parse(JSON.stringify(inc));
    copy.snaps = {}; copy.log = {};
    if(mode === "update" && mine){
      copy.id = mine.id; copy.name = mine.name;
      copy.snaps = mine.snaps || {}; copy.log = mine.log || {};
      store.budgets = store.budgets.map(x => x.id === mine.id ? copy : x);
    } else {
      copy.id = uid();
      if(mine) copy.name = (inc.sharedName || inc.name || "Shared") + " copy";
      store.budgets.push(copy);
    }
    store.activeId = copy.id;
    save();
  }
  closeSheet();
  if(onDone) onDone();
  if(mode !== "skip") toast(mode === "update" ? "Budget updated" : "Budget added");
}

/* Every suggestion in the Health tab can apply itself, but never silently:
   this spells out the before and after first. */
function askFix(fx){
  if(!fx) return;
  const b = B(), per = payPerYear(b);
  let title = "Apply this change?", body = "", apply = null;
  if(fx.act === "stretchGoal"){
    const g = (b.goals||[]).find(x=>x.id===fx.id); if(!g) return;
    const before = goalPerCheck(b,g);
    const after = goalPerCheck(b, Object.assign({}, g, {months:fx.months}));
    title = "Stretch " + g.name + "?";
    body = `The deadline moves from <b>${fmtMY(goalEnd(b,g))}</b> to <b>${fmtMY(addMonths(goalStart(b,g), fx.months))}</b>.
      Each paycheck puts in <b>${money(after)}</b> instead of ${money(before)}, which hands
      <b>${money(before-after)}</b> a check back to the rest of your budget.
      You still reach ${money(g.target)} — it just takes ${fx.months - (+g.months||12)} months longer.`;
    apply = ()=>{ g.months = fx.months; };
  } else if(fx.act === "trimAllowance"){
    const from = +b.allowance||0;
    title = "Trim loose spending money?";
    body = `Your loose spending goes from <b>${money(from)}</b> to <b>${money(fx.to)}</b> a check,
      freeing <b>${money(monthlyOf(b, from-fx.to))}</b> a month.
      ${bucketTotal(b)>0?`Anything you've earmarked stays exactly as it is.`:""}`;
    apply = ()=>{ b.allowance = fx.to; };
  } else if(fx.act === "setAllowance"){
    title = "Set aside spending money?";
    body = `<b>${money(fx.to)}</b> comes out of every paycheck as spending money, or
      <b>${money(monthlyOf(b, fx.to))}</b> a month. You can split it into groceries, gas and the
      rest afterwards under Money.`;
    apply = ()=>{ b.allowance = fx.to; };
  } else if(fx.act === "addCatchAll"){
    title = "Add a catch-all goal?";
    body = `A flexible savings goal with no target, sitting last in your list. It only
      receives what the goals above it leave behind, so it changes nothing until they're
      full — then it catches the rest instead of letting it drift.`;
    apply = ()=>{ b.goals = b.goals||[];
      b.goals.push({ id:uid(), type:"savings", flex:true, name:"Long-term savings",
                     target:0, months:0, saved:0, apr:0, start:iso(today()) }); };
  } else if(fx.act === "addEF"){
    const g = { id:uid(), type:"savings", name:"Emergency fund", target:fx.amount,
                months:fx.months, saved:0, start:iso(today()) };
    title = "Start an emergency fund?";
    body = `A goal of <b>${money(fx.amount)}</b> over <b>${fx.months} months</b>, which asks
      <b>${money(goalPerCheck(b,g))}</b> of each paycheck. If that's too steep you can stretch
      it afterwards, and the Health tab will tell you if it doesn't fit.`;
    apply = ()=>{ b.goals = b.goals||[]; b.goals.push(g); };
  } else if(fx.act === "splitBill"){
    const e = b.expenses.find(x=>x.id===fx.id); if(!e) return;
    const slices = Math.max(2, tcOf(b));
    title = "Split " + e.name + " across paychecks?";
    body = `Instead of <b>${money(e.amount)}</b> leaving one check, about
      <b>${money((+e.amount||0)/slices)}</b> gets set aside from each check and the bill is
      paid when it's due. The money stays in checking until then.`;
    apply = ()=>{ e.sinking = true; e.splitManual = true; };
  } else if(fx.act === "removeBill"){
    const e = b.expenses.find(x=>x.id===fx.id); if(!e) return;
    title = "Remove " + e.name + "?";
    body = `It has a zero balance, so the <b>${money(monthlyCost(e))}</b> a month the plan is
      holding back for it goes back into your paychecks. This deletes the bill for good.`;
    apply = ()=>{ b.expenses = b.expenses.filter(x=>x.id!==fx.id); };
  } else return;
  openSheet(title, `
    <p style="margin:16px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink2)">${body}</p>
    <button class="btn ghost" style="margin-top:20px" data-act="closeSheet">Leave it as it is</button>`,
    "Yes, update my budget", ()=>{
      apply(); save(); closeSheet(); render(); toast("Budget updated");
    });
}

    <h2 class="sec" style="font-size:15px;font-family:var(--sans)">Month by month until it's gone</h2>
    <p class="sec-note">${info.method==="avalanche"?"Highest rate first":"Smallest balance first"}${info.extra>0?", with "+money(info.extra)+" a month of extra spread down the list":""}.</p>
    ${trail.length ? `<div class="sched sched-4">
      <div class="sched-row head"><span>Month</span><b>Paid</b><i>Interest</i><em>Balance</em></div>
      ${trail.map(t=>`<div class="sched-row${t.balance<=0?" done":""}">
        <span>${fmtMY(addMonths(today(), t.month))}</span>
        <b>${money(t.paid)}</b>
        <i>${money(t.interest)}</i>
        <em>${money(t.balance)}</em></div>`).join("")}</div>`
      : `<div class="empty-check">Nothing to project — this one has no balance.</div>`}

    <button class="btn ghost" style="margin-top:18px" data-act="editDebt" data-id="${eid}">Edit this account</button>`, null);
}

/* ============================================================
   Guided setup
   ============================================================ */
let ob = null;
function startOnboarding(extra){
  // a second budget gets the same guided setup as a first launch, not an empty shell
  const name = extra ? "Budget " + (store.budgets.length + 1) : "My budget";
  ob = { step:0, b:newBudget(name), editId:null, lastCat:"housing", addingIncome:false,
         extra: !!extra, prevActive: store.activeId, paySaved:false,
         bukEdit:null, lastBukCat:"groceries" };
  drawOb();
}
function cancelOnboarding(){
  const back = ob && ob.prevActive;
  ob = null; $("obRoot").innerHTML = "";
  if(back) store.activeId = back;
  if(store.budgets.length) render();
}
function drawOb(){
  const b = ob.b, s = ob.step;
  const steps = 5;
  let body = "";
  if(s===0){
    body = `<div class="ob-step">${ob.extra?"New budget":"Setting up"}</div>
      <h1>${ob.extra?"Let's build another plan.":"Let's make sure no paycheck ever feels bill-heavy."}</h1>
      <p>${ob.extra
        ? "Same four steps as before. Your other budgets stay exactly as they are — nothing here touches them."
        : "Four short steps. You'll enter what you take home, what you owe and when it's due, how much you want to keep for yourself, and what you're saving toward."}</p>
      <p>${ob.extra
        ? "Use it to test a different set of goals, or to plan a change before you commit to it."
        : "After that the app decides which bills come out of which check, and re-decides every time something changes."}</p>
      ${ob.extra?`<label class="f"><span>Call it</span>
        <input type="text" id="obBudgetName" value="${esc(b.name)}" placeholder="Budget 2"></label>`:""}
      <div class="mini-list" style="margin-top:26px">
        <div class="mini"><b>1. Your pay</b><em>·</em></div>
        <div class="mini"><b>2. Your bills</b><em>·</em></div>
        <div class="mini"><b>3. Your spending money</b><em>·</em></div>
        <div class="mini"><b>4. Your goals</b><em>·</em></div>
      </div>`;

    const saved = !!ob.paySaved && (+b.pay.amount||0) > 0;
    const payFreq = (PAYF.find(f=>f.id===b.pay.freq)||PAYF[0]).name.toLowerCase();
    body = `<div class="ob-step">Step 1 of 4</div><h1>What comes in?</h1>
      <p>Start with your own pay — the amount that actually hits your account, not your salary. You can add anything else once it's saved.</p>

      ${saved ? `<div class="card" style="margin-top:16px">
        <div class="row">
          <span class="swatch" style="background:var(--pine)"></span>
          <span class="row-main"><span class="row-title">${money2(b.pay.amount)} ${payFreq}</span>
            <span class="row-sub">next on ${fmtSmartShort(D(b.pay.next))}${(+b.startBalance||0)>0?` · ${money(b.startBalance)} in checking now`:""}</span></span>
          <button data-ob-pay-edit="1" style="color:var(--pine);font-weight:600;font-size:13px;padding:6px">Edit</button>
        </div></div>`
      : `<label class="f"><span>Your take-home, each payday</span><div class="money-in">
          <input type="number" inputmode="decimal" id="obAmt" value="${b.pay.amount||""}" step="0.01" placeholder="0.00"></div></label>
        <label class="f"><span>How often</span><select id="obFreq">${PAYF.map(f=>`<option value="${f.id}" ${b.pay.freq===f.id?"selected":""}>${f.name}</option>`).join("")}</select></label>
        <label class="f"><span>Next payday</span><input type="date" id="obNext" value="${b.pay.next}"></label>
        <label class="f"><span>In checking right now</span><div class="money-in">
          <input type="number" inputmode="decimal" id="obStart" value="${b.startBalance||""}" step="0.01" placeholder="0.00"></div>
          <div class="hint">Optional. Monthly bills and biweekly pay never line up perfectly, and this is what bridges the gap between paydays.</div></label>
        <button class="btn" style="margin-top:16px" id="obPaySave">Save this income</button>`}

      ${saved ? `
      <h2 class="sec" style="font-size:15px;font-family:var(--sans)">Anything else coming in?</h2>
      <p class="sec-note">A second job, your partner's pay, a regular side gig. Skip it if there's nothing.</p>
      <div class="mini-list">${(b.extras||[]).map(x=>`<div class="mini">
        <i style="width:9px;height:9px;border-radius:2px;background:var(--steel);display:block"></i>
        <b style="flex:1">${esc(x.label)}<span style="display:block;font-size:11px;color:var(--ink3);font-weight:400">${((EXTRA_FREQS.find(f=>f.id===(x.freq||"once"))||{}).name||"One time").toLowerCase()}</span></b>
        <em>${money2(x.amount)}</em>
        <button data-ob-inc-del="${x.id}" aria-label="Remove"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      </div>`).join("")}</div>
      <div id="obIncForm" style="display:${ob.addingIncome?"block":"none"}">
        <div class="two">
          <label class="f" style="flex:1.6"><span>Name</span><input type="text" id="obIncName" placeholder="My wife's pay"></label>
          <label class="f" style="flex:1"><span>Amount</span><div class="money-in"><input type="number" inputmode="decimal" id="obIncAmt" step="0.01"></div></label>
        </div>
        <div class="two">
          <label class="f"><span>How often</span><select id="obIncFreq">${EXTRA_FREQS.map(f=>`<option value="${f.id}" ${f.id==="biweekly"?"selected":""}>${f.name}</option>`).join("")}</select></label>
          <label class="f"><span>Next one</span><input type="date" id="obIncDate" value="${iso(addDays(today(),7))}"></label>
        </div>
        <button class="btn" style="margin-top:12px" id="obIncSave">Save this income</button>
      </div>
      <button class="btn ghost" style="margin-top:${ob.addingIncome?"9":"4"}px" id="obIncToggle">${ob.addingIncome?"Cancel":"+ Add another source of income"}</button>`
      : `<p class="hint" style="margin-top:14px">Got more than one income? Save this one first and the option appears.</p>`}`;
  } else if(s===2){
    const ed = ob.editId ? b.expenses.find(x=>x.id===ob.editId) : null;
    const curCat = ed ? ed.cat : (ob.lastCat || "housing");
    body = `<div class="ob-step">Step 2 of 4</div><h1>What has to get paid?</h1>
      <p>These are bills with a set amount due on a set date: rent, car payment, insurance, phone. Anything you swipe a card for — groceries, gas, haircuts — comes on the next screen.</p>
      <label class="f"><span>Kind of bill</span>
        <select id="obCat">${CATS.map(c=>`<option value="${c.id}" ${curCat===c.id?"selected":""}>${c.name}</option>`).join("")}</select></label>
      <div class="two">
        <label class="f" style="flex:1.6"><span>Name</span>
          <input type="text" id="obName" value="${ed?esc(ed.name):esc(catOf(curCat).name)}"></label>
        <label class="f" style="flex:1"><span>Amount</span>
          <div class="money-in"><input type="number" inputmode="decimal" id="obBillAmt" step="0.01" value="${ed?ed.amount:""}"></div></label>
      </div>
      <label class="f"><span>How often</span>
        <select id="obFreq2">${FREQS.map(f=>`<option value="${f.id}" ${(ed?(ed.freq||"monthly"):"monthly")===f.id?"selected":""}>${f.name}</option>`).join("")}</select></label>
      <div id="obDueMonthly" style="display:${(ed?(ed.freq||"monthly"):"monthly")==="monthly"?"block":"none"}">
        <label class="f"><span>Due day of the month</span>
          <select id="obDay">${Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${(ed?ed.dueDay:1)===d?"selected":""}>${ordinal(d)}</option>`).join("")}</select></label>
      </div>
      <div id="obDueDated" style="display:${(ed?(ed.freq||"monthly"):"monthly")==="monthly"?"none":"block"}">
        <label class="f"><span>Next time it's due</span>
          <input type="date" id="obDueDate" value="${ed&&ed.dueDate?ed.dueDate:iso(addDays(today(),14))}">
          <div class="hint">It'll repeat from this date onward.</div></label>
      </div>
      <button class="btn" style="margin-top:16px" id="obAddBill">${ed?"Save changes":"Add this bill"}</button>
      ${ed?`<button class="btn ghost" id="obCancelEdit">Cancel</button>`:""}
      <div class="mini-list">${b.expenses.map(e=>`<div class="mini">
        <i style="width:9px;height:9px;border-radius:2px;background:${catOf(e.cat).color};display:block"></i>
        <button data-ob-edit="${e.id}" style="flex:1;display:flex;gap:10px;align-items:center;text-align:left">
          <b style="flex:1">${esc(e.name)}${(e.freq||"monthly")!=="monthly"?`<span style="display:block;font-size:11px;color:var(--ink3);font-weight:400">${(FREQS.find(f=>f.id===e.freq)||{}).name}</span>`:""}</b><em>${money2(e.amount)}</em></button>
        <button data-ob-del="${e.id}" aria-label="Remove ${esc(e.name)}"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      </div>`).join("")}</div>
      ${b.expenses.length?`<p class="hint">Anything over a fifth of your paycheck is split across checks automatically, and bills that come quarterly or yearly are saved for a bit at a time, so one check never swallows the whole thing.</p>`:""}`;
  } else if(s===3){
    const bt = (b.buckets||[]).reduce((t,x)=>t+(+x.amount||0),0);
    const total = bt + (+b.allowance||0);
    const ed = ob.bukEdit ? (b.buckets||[]).find(x=>x.id===ob.bukEdit) : null;
    const SUGGEST = [
      ["Groceries","groceries"], ["Gas","carcost"], ["Eating out","personal"],
      ["Household","household"], ["Haircuts","personal"], ["Pet supplies","household"],
      ["Kids","childcare"], ["Medical","medical"], ["Subscriptions","subs"]
    ];
    body = `<div class="ob-step">Step 3 of 4</div><h1>What do you spend on?</h1>
      <p>The things you put on a card with no due date. Name them whatever makes sense to you and give each a rough amount per paycheck — it doesn't have to be exact.</p>
      <p style="color:var(--ink3);font-size:13.5px">Savings and paying off debt come on the next screen, so don't hold anything back for those here.</p>

      <div class="mini-list">${(b.buckets||[]).map(x=>`<div class="mini">
        <i style="width:9px;height:9px;border-radius:2px;background:${catOf(x.cat).color};display:block"></i>
        <button data-ob-buk-edit="${x.id}" style="flex:1;display:flex;gap:10px;align-items:center;text-align:left">
          <b style="flex:1">${esc(x.name)}</b><em>${money2(x.amount)}</em></button>
        <button data-ob-buk-del="${x.id}" aria-label="Remove"><svg width="13" height="13" viewBox="0 0 14 14"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      </div>`).join("")}</div>

      <div class="two">
        <label class="f" style="flex:1.6"><span>Name it</span>
          <input type="text" id="obBukName" value="${ed?esc(ed.name):""}" placeholder="Groceries, dog food, gas"></label>
        <label class="f" style="flex:1"><span>Per paycheck</span>
          <div class="money-in"><input type="number" inputmode="decimal" id="obBukAmt" value="${ed?ed.amount:""}" step="0.01"></div></label>
      </div>
      <label class="f"><span>Counts as</span>
        <select id="obBukCat">${SPEND_CATS.map(c=>`<option value="${c}" ${(ed?ed.cat:ob.lastBukCat||"groceries")===c?"selected":""}>${catOf(c).name}</option>`).join("")}</select>
        <div class="hint">Only used for grouping and colour on the Health tab. The name is yours.</div></label>
      <button class="btn" style="margin-top:14px" id="obBukAdd">${ed?"Save changes":"Add this"}</button>
      ${ed?`<button class="btn ghost" id="obBukCancel">Cancel</button>`:`
      <div class="quick" style="margin-top:12px">${SUGGEST.slice(0,6).map(([n,c])=>
        `<button data-ob-buk-quick="${n}|${c}">${n}</button>`).join("")}</div>
      <div class="quick" style="margin-top:7px">${SUGGEST.slice(6).map(([n,c])=>
        `<button data-ob-buk-quick="${n}|${c}">${n}</button>`).join("")}</div>`}

      <h2 class="sec" style="font-size:15px;font-family:var(--sans)">Free spending</h2>
      <p class="sec-note">Whatever's left for you to use however you like, with nothing attached to it.</p>
      <div class="amt-field"><div class="money-in">
        <input type="number" inputmode="decimal" id="obAllow" step="1" value="${b.allowance||""}" placeholder="0"></div></div>

      <div class="card" style="margin-top:16px;padding:15px 16px">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span class="row-title">Spending money per paycheck</span>
          <span class="num" style="font-size:22px" id="obSpendTotal">${money(total)}</span></div>
        <div class="row-sub" style="margin-top:3px" id="obAllowSub">${money(total*typicalCount(b.pay.freq))} in a normal month${b.pay.amount>0?` · ${Math.round(total/b.pay.amount*100)}% of each check`:""}</div>
      </div>`;
  } else if(s===4){
    body = `<div class="ob-step">Step 4 of 4</div><h1>What are you working toward?</h1>
      <p>One is enough to start. Skip it and the app will suggest a sensible order once your plan is built.</p>
      <label class="f"><span>Goal name</span><input type="text" id="obGName" placeholder="Emergency fund"></label>
      <div class="two"><label class="f"><span>Amount</span><div class="money-in"><input type="number" inputmode="decimal" id="obGTarget" step="0.01" placeholder="5000"></div></label>
      <label class="f"><span>Within</span><select id="obGMonths">${[3,6,9,12,18,24,36].map(m=>`<option value="${m}" ${m===12?"selected":""}>${m} months</option>`).join("")}</select></label></div>
      <div class="hint" id="obGPer"></div>`;
  }
  $("obRoot").innerHTML = `<div class="ob"><div class="ob-in">
    <div class="ob-bar"><span style="width:${s/steps*100}%"></span></div>
    <div class="ob-body">${body}</div>
    <div class="ob-foot"><div class="two">
      ${s>0?`<button class="btn ghost" id="obBack">Back</button>`
           :(ob.extra?`<button class="btn ghost" id="obCancel">Cancel</button>`:"")}
      <button class="btn ${s===2?"ghost go":""}" id="obNextBtn">${s===0?"Get started":s===4?"Build my plan":s===2?"Done adding bills":"Continue"}</button>
    </div></div></div></div>`;
  if(s===1){
    if($("obPaySave")) $("obPaySave").addEventListener("click", ()=>{
      const amt = parseFloat(val("obAmt"))||0;
      if(amt <= 0){ toast("Enter what you take home first"); return; }
      collectOb();
      ob.paySaved = true; drawOb();
      toast("Income saved");
    });
    $("obRoot").querySelectorAll("[data-ob-pay-edit]").forEach(el=>{
      el.addEventListener("click", ()=>{ ob.paySaved = false; drawOb(); });
    });
    // the extra-income block only exists once the main pay is saved; skipping it must
    // not skip the footer wiring below, or Continue and Cancel go dead
    if($("obIncToggle")) $("obIncToggle").addEventListener("click", ()=>{
      collectOb(); ob.addingIncome = !ob.addingIncome; drawOb();
    });
    if($("obIncSave")) $("obIncSave").addEventListener("click", ()=>{
      const n = val("obIncName").trim(), amt = parseFloat(val("obIncAmt"))||0;
      if(!n || amt<=0){ toast("Add a name and an amount"); return; }
      collectOb();
      ob.b.extras = ob.b.extras || [];
      ob.b.extras.push({ id:uid(), label:n, amount:amt, freq:val("obIncFreq")||"biweekly",
                         date: val("obIncDate")||iso(addDays(today(),7)) });
      ob.addingIncome = false; drawOb();
    });
    $("obRoot").querySelectorAll("[data-ob-inc-del]").forEach(el=>{
      el.addEventListener("click", ()=>{
        collectOb();
        ob.b.extras = (ob.b.extras||[]).filter(x=>x.id!==el.dataset.obIncDel);
        drawOb();
      });
    });
  }
  if(s===2){
    const nameEl = $("obName"), catEl = $("obCat");
    // picking a category names the bill for you, unless you've typed your own
    catEl.addEventListener("change", ()=>{
      const cur = nameEl.value.trim();
      if(cur === "" || CATS.some(c=>c.name === cur)) nameEl.value = catOf(catEl.value).name;
    });
    $("obFreq2").addEventListener("change", ()=>{
      const m = val("obFreq2") === "monthly";
      $("obDueMonthly").style.display = m ? "block" : "none";
      $("obDueDated").style.display   = m ? "none"  : "block";
    });
    $("obAddBill").addEventListener("click", ()=>{
      const n = nameEl.value.trim(), a = parseFloat(val("obBillAmt"))||0;

      const rec = { name:n, amount:a, cat:catEl.value, freq:val("obFreq2")||"monthly",
                    dueDay:+val("obDay")||1, dueDate:val("obDueDate")||iso(addDays(today(),14)) };
      if(ob.editId){
        const e = ob.b.expenses.find(x=>x.id===ob.editId);
        if(e) Object.assign(e, rec);
        ob.editId = null;
      } else {
        ob.b.expenses.push(Object.assign({ id:uid() }, rec));
      }
      ob.lastCat = rec.cat;
      autoSplit(ob.b);
      drawOb();
    });
    if($("obCancelEdit")) $("obCancelEdit").addEventListener("click", ()=>{ ob.editId = null; drawOb(); });
