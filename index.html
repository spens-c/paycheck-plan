/* ---------- Debt ---------- */
function debtRow(b, e){
  const c = catOf(e.cat);
  const bal = +e.balance||0, apr = +e.apr||0;
  // never filled in is not the same thing as paid off
  const missing = bal <= 0 && apr <= 0;
  const cleared = bal <= 0 && !missing;
  const left = +e.paymentsLeft||0;
  let when = (e.freq||"monthly")==="monthly" ? "minimum "+money2(e.amount||0)+" on the "+ordinal(e.dueDay||1)
             : "minimum "+money2(e.amount||0)+" "+((FREQS.find(f=>f.id===e.freq)||{}).name||"").toLowerCase();
  if(left > 0) when = left+" payments of "+money2(e.amount||0)+" left";
  if(e.offBudget) when += " · paid from another account";
  return `<button class="row" data-act="editExpense" data-id="${e.id}">
    <span class="swatch" style="background:${cleared?'var(--line)':c.color}"></span>
    <span class="row-main"><span class="row-title">${esc(e.name)}
      ${cleared?'<span class="pill" style="background:var(--pine-soft);color:var(--pine)">paid off</span>':""}</span>
      <span class="row-sub">${missing ? "tap to add the balance and rate" : (cleared ? when : apr.toFixed(2).replace(/\.00$/,"")+"% APR · "+when)}</span></span>
    <span class="row-amt">${missing?"—":money(bal)}<small>${missing?"not set":cleared?"cleared":"owed"}</small></span></button>`;
}

    ${(()=>{ const di = O.interest-R.interest, dm = O.months-R.months, other = rec==="avalanche"?"snowball":"avalanche";
      const timing = dm===0 ? "finishes the same month" : `finishes ${Math.abs(dm)} month${Math.abs(dm)===1?"":"s"} ${dm>0?"later":"sooner"}`;
      const cost = Math.abs(di) < 1 ? "costs the same in interest" : `${di>0?"costs":"saves"} ${money(Math.abs(di))} in interest`;
      return `<div class="flag watch" style="margin-top:11px"><h4><span>If you went the other way</span><em>${money(Math.abs(di))}</em></h4>

function spendBars(b, a){
  const groups = {};
  b.expenses.forEach(e=>{ const g = catOf(e.cat); groups[g.id] = (groups[g.id]||0) + monthlyCost(e); });
  const rows = Object.entries(groups).sort((x,y)=>y[1]-x[1]);
  if(a.allowM>0) rows.push(["_allow", a.allowM]);
  if(a.savingsM>0) rows.push(["_save", a.savingsM]);
  if(a.leftM>0) rows.push(["_left", a.leftM]);
  const max = Math.max(...rows.map(r=>r[1]), 1);
  const label = id => id==="_allow"?"Spending allowance": id==="_save"?"Savings goals": id==="_left"?"Unassigned": catOf(id).name;
  const color = id => id==="_allow"?"var(--steel)": id==="_save"?"var(--violet)": id==="_left"?"var(--line)": catOf(id).color;
  return rows.map(([id,v])=>`<div style="margin-bottom:11px">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
      <span>${label(id)}</span><span class="num">${money(v)}<span style="color:var(--ink3);font-size:11px"> · ${Math.round(a.inc?v/a.inc*100:0)}%</span></span></div>
    <div class="track" style="margin:0"><span style="width:${v/max*100}%;background:${color(id)}"></span></div></div>`).join("");
}
function compareTable(b, others){
  const rows = [b, ...others].map(x=>{
    const p = buildPlan(x), an = analyze(x, p);
    const ds = debtSummary(x, p);
    const sim = ds.debts.length ? simulate(ds.debts, ds.extra, "avalanche") : null;
    return { name:x.name, an, p, sim, ds };
  });
  const cell = (fn) => rows.map(r=>`<td>${fn(r)}</td>`).join("");
  return `<div style="overflow-x:auto"><table class="cmp">
    <thead><tr><th>Scenario</th>${rows.map(r=>`<th>${esc(r.name)}</th>`).join("")}</tr></thead>

      <tr><td>Allowance / month</td>${cell(r=>money(r.an.allowM))}</tr>
      <tr><td>Debt-free in</td>${cell(r=>r.sim&&isFinite(r.sim.months)?r.sim.months+" mo":"—")}</tr>
      <tr><td>Interest paid</td>${cell(r=>r.sim&&isFinite(r.sim.interest)?money(r.sim.interest):"—")}</tr>
      <tr><td>Tightest check</td>${cell(r=>r.p.checks.length?Math.round(Math.max(...r.p.checks.map(c=>c.load))*100)+"%":"—")}</tr>
      <tr><td>Red flags</td>${cell(r=>r.an.flags.filter(f=>f.sev==="crit").length)}</tr>

/* ============================================================
   The ledger: making a tick actually move a balance
   ============================================================ */
function paidRec(b, key){
  const r = b.paid && b.paid[key];
  if(!r) return null;
  return r === true ? { on:true, delta:0, amount:0 } : r;
}
const isDebtCat = c => c==="creditcard" || c==="loan";

// Interest accrued on a card between one payment and the next. A $95 payment on
// $4,200 at 25% moves the balance about $8, and the app should say so.
function accrued(e){
  const f = FREQS.find(x=>x.id===(e.freq||"monthly")) || FREQS[0];
  const months = f.perYear > 0 ? 12/f.perYear : 1;
  return (+e.balance||0) * (+e.apr||0)/100/12 * months;
}
function setPaid(b, occ, on, actualBalance){
  b.paid = b.paid || {};
  const e = b.expenses.find(x=>x.id===occ.eid);
  if(on){
    if(b.paid[occ.key]) return paidRec(b, occ.key);
    let delta = 0, interest = 0;
    if(e && isDebtCat(e.cat) && (+e.balance||0) > 0){
      interest = accrued(e);
      const before = +e.balance||0;
      // round first, then take the delta from the rounded figure, so unticking
      // restores the balance to the cent instead of drifting
      const after = Math.round(Math.max(0, (actualBalance != null && actualBalance !== "")
        ? +actualBalance
        : before + interest - (+occ.amount||0)) * 100) / 100;
      delta = Math.round((after - before)*100)/100;
      e.balance = after;
    }
    b.paid[occ.key] = { on:true, delta, interest, eid:occ.eid, amount:+occ.amount||0, at:iso(today()) };
    return b.paid[occ.key];
  }
  const r = paidRec(b, occ.key);
  if(r && r.delta && e) e.balance = Math.max(0, Math.round(((+e.balance||0) - r.delta)*100)/100);
  if(b.paid) delete b.paid[occ.key];
  return null;
}
const goalKey = (gid, checkId) => "goal:" + gid + "@" + checkId;
// where a flexible "attack my debt" contribution actually lands: the priciest balance
function nextDebtTarget(b){
  const live = (b.expenses||[])
    .filter(e => (e.cat==="creditcard"||e.cat==="loan") && (+e.balance||0) > 0)
    .sort((x,y)=> (+y.apr||0)-(+x.apr||0) || (+x.balance||0)-(+y.balance||0));
  return live[0] || null;
}
function setGoalPaid(b, gid, checkId, amount, on, targetEid){
  b.paid = b.paid || {};
  const key = goalKey(gid, checkId);
  const g = (b.goals||[]).find(x=>x.id===gid);
  if(!g) return;
  if(on){
    if(b.paid[key]) return;
    let delta = 0;
    if(g.type==="savings"){
      g.saved = Math.round(((+g.saved||0) + (+amount||0))*100)/100;
    } else if(targetEid){
      // extra money above the minimum comes straight off that balance
      const e = (b.expenses||[]).find(x=>x.id===targetEid);
      if(e){
        const before = +e.balance||0;
        const after = Math.round(Math.max(0, before - (+amount||0))*100)/100;
        delta = Math.round((after - before)*100)/100;
        e.balance = after;
      }
    }
    b.paid[key] = { on:true, goal:gid, amount:+amount||0, eid:targetEid, delta, at:iso(today()) };
  } else {
    const r = paidRec(b, key);
    if(r && g.type==="savings") g.saved = Math.max(0, Math.round(((+g.saved||0) - (+r.amount||0))*100)/100);
    if(r && r.delta && r.eid){
      const e = (b.expenses||[]).find(x=>x.id===r.eid);
      if(e) e.balance = Math.max(0, Math.round(((+e.balance||0) - r.delta)*100)/100);
    }
    delete b.paid[key];
  }
}

/* ---------- snapshots ----------
   What a paycheck was planned to cover, frozen at the time. Without this a
   check-in two days late would have nothing to check in against, because the
   plan only ever generates bills from today forward. */
function snapshot(b, plan){
  if(!plan.checks.length) return;
  b.snaps = b.snaps || {}; b.log = b.log || {};
  let dirty = false;
  plan.checks.slice(0,2).forEach(c=>{
    if(b.log[c.id]) return;                       // already confirmed, leave it alone
    const snap = {
      date: iso(c.date), income: c.income, allowance: c.allowance, debtExtra: c.debtExtra||0,
      items: c.items.map(o=>({ key:o.key, eid:o.eid, name:o.name, cat:o.cat, amount:o.amount, due:iso(o.due) })),
      goals: [
        ...(c.goals||[]).filter(g=>g.per>0).map(g=>({ id:g.id, name:g.name, type:g.type, amount:g.per })),
        ...(c.flex||[]).map(f=>{
          const t = f.type==="debt" ? nextDebtTarget(b) : null;
          return { id:f.id, name:f.name, type:f.type, amount:f.amount,
                   targetEid: t?t.id:undefined, targetName: t?t.name:undefined };
        })
      ],
      sink: c.sinking.map(x=>({ name:x.name, amount:x.amount })),
      expected: c.left
    };
    if(JSON.stringify(b.snaps[c.id]) !== JSON.stringify(snap)){ b.snaps[c.id] = snap; dirty = true; }
  });
  // don't let old snapshots pile up forever
  const cut = iso(addMonths(today(), -8));
  Object.keys(b.snaps).forEach(k=>{ if(b.snaps[k].date < cut){ delete b.snaps[k]; dirty = true; } });
  return dirty;
}
function pendingCheckin(b){
  if(!b.snaps) return null;
  const t = iso(today());
  const due = Object.keys(b.snaps)
    .filter(k => b.snaps[k].date <= t && !(b.log||{})[k])
    .sort((a,c)=> b.snaps[a].date < b.snaps[c].date ? -1 : 1);
  return due.length ? { id:due[0], snap:b.snaps[due[0]] } : null;
}

/* ---------- the check-in screen ---------- */
let CI = null;
function openCheckin(id){
  const b = B();
  const snap = (b.snaps||{})[id];
  if(!snap) return;
  CI = { id, snap, ticks:{}, balances:{} };
  snap.items.forEach(o=>{ CI.ticks[o.key] = !paidRec(b, o.key) ? true : true; });
  snap.goals.forEach(g=>{ CI.ticks[goalKey(g.id, id)] = true; });
  drawCheckin();
}
function drawCheckin(){
  const b = B(), s = CI.snap;
  const row = (key, name, sub, amount, extra) => `

      <span class="tick ${CI.ticks[key]?'done':''}"><svg width="11" height="9" viewBox="0 0 11 9"><path d="M1 4.6L4 7.5 10 1.3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

  const bills = s.items.map(o=>{
    const e = b.expenses.find(x=>x.id===o.eid);
    let sub = "was due " + fmtDate(D(o.due));
    let extra = "";
    if(e && isDebtCat(e.cat) && (+e.balance||0) > 0 && CI.ticks[o.key]){
      const int = accrued(e);
      const proj = Math.max(0, (+e.balance||0) + int - o.amount);
      sub = money(int)+" of this is interest";
      extra = `<div style="padding:0 16px 13px 48px">
        <div class="row-sub" style="margin-bottom:6px">Balance ${money(e.balance)} → <b>${money(proj)}</b> after this payment.</div>

          value="${CI.balances[o.eid]!=null?CI.balances[o.eid]:""}" placeholder="or type the real balance"></div></div>`;
    }
    return row(o.key, o.name, sub, o.amount, extra);
  }).join("");
  const goals = s.goals.map(g=>row(goalKey(g.id, CI.id), g.name,
    g.type==="savings" ? "into savings"
      : (g.targetName ? "extra toward "+esc(g.targetName) : "extra toward debt"), g.amount)).join("");
  const sink = s.sink.length ? `<div class="row"><span class="row-main">
      <span class="row-title">${s.sink.map(x=>esc(x.name)).join(", ")} set aside</span>
      <span class="row-sub">stays in checking until it's due</span></span>
      <span class="row-amt">${money(s.sink.reduce((a,x)=>a+x.amount,0))}</span></div>` : "";
  $("obRoot").innerHTML = `<div class="ob"><div class="ob-in">
    <div class="ob-bar"><span style="width:100%"></span></div>
    <div class="ob-body">
      <div class="ob-step">Payday check-in</div>
      <h1>${fmtLong(D(s.date))}</h1>
      <p>Here's what this paycheck was set to cover. Untick anything that didn't happen, then confirm.</p>
      <h2 class="sec" style="font-size:15px;font-family:var(--sans)">Bills</h2>
      <div class="card">${bills || '<div class="empty-check">Nothing was due from this check.</div>'}</div>
      ${goals?`<h2 class="sec" style="font-size:15px;font-family:var(--sans)">Goals</h2><div class="card">${goals}</div>`:""}
      ${sink?`<h2 class="sec" style="font-size:15px;font-family:var(--sans)">Set aside</h2><div class="card">${sink}</div>`:""}
      <h2 class="sec" style="font-size:15px;font-family:var(--sans)">Reality check</h2>
      <p class="sec-note">Optional. If the number's off, it's better to know now than in March.</p>
      <label class="f"><span>What's in checking today?</span>
        <div class="money-in"><input type="number" inputmode="decimal" id="ciActual" step="0.01"
          value="${CI.actual!=null?CI.actual:""}" placeholder="0.00"></div>
        <div class="hint">The plan expected about ${money(s.expected + (+b.startBalance||0))} left after this check.</div></label>
    </div>
    <div class="ob-foot"><div class="two">
      <button class="btn ghost" id="ciSkip">Skip</button>
      <button class="btn" id="ciDone">Confirm</button>
    </div></div></div></div>`;
  $("obRoot").querySelectorAll("[data-ci]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const k = el.dataset.ci;
      CI.balances = readBalances();
      CI.actual = val("ciActual");
      CI.ticks[k] = !CI.ticks[k];
      drawCheckin();
    });
  });
  $("ciSkip").addEventListener("click", ()=>{ CI=null; $("obRoot").innerHTML=""; render(); });
  $("ciDone").addEventListener("click", confirmCheckin);
}
function readBalances(){
  const out = {};
  $("obRoot").querySelectorAll("input[id^='ci-bal-']").forEach(el=>{
    if(el.value !== "") out[el.id.replace("ci-bal-","")] = el.value;
  });
  return out;
}
function confirmCheckin(){
  const b = B(), s = CI.snap;
  const bals = readBalances();
  const actual = val("ciActual");
  s.items.forEach(o=>{
    const on = !!CI.ticks[o.key];
    if(on) setPaid(b, o, true, bals[o.eid]);
    else setPaid(b, o, false);
  });
  s.goals.forEach(g=> setGoalPaid(b, g.id, CI.id, g.amount,
    !!CI.ticks[goalKey(g.id, CI.id)], g.targetEid));
  b.log = b.log || {};
  const expected = s.expected + (+b.startBalance||0);
  const rec = { at: iso(today()), expected };
  if(actual !== ""){
    rec.actual = +actual;
    rec.drift = +actual - expected;
    b.startBalance = +actual;      // reality wins: re-base the plan on the real number
  }
  b.log[CI.id] = rec;
  const drift = rec.drift;
  CI = null; $("obRoot").innerHTML = "";
  save(); render();
  if(drift == null) toast("Logged — balances updated");
  else if(Math.abs(drift) < 20) toast("Logged — you're right on plan");
  else toast("Logged — you're " + money(Math.abs(drift)) + (drift<0 ? " behind plan" : " ahead of plan"));
}

/* ============================================================
   Sharing a budget
   Nothing is stored on a server, so a shared budget travels inside the link
   itself. That means the plain app URL carries no data at all: anyone you send
   it to gets an empty app.
   ============================================================ */
const B64 = {
  enc(bytes){ let s = ""; for(let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  dec(str){ const s = atob(str.replace(/-/g,"+").replace(/_/g,"/"));
    const out = new Uint8Array(s.length);
    for(let i=0;i<s.length;i++) out[i] = s.charCodeAt(i);
    return out; }
};
async function gzipStr(str){
  if(typeof CompressionStream === "undefined") return null;
  try{
    const cs = new CompressionStream("gzip");
    const w = cs.writable.getWriter();
    w.write(new TextEncoder().encode(str)).catch(()=>{});
    w.close().catch(()=>{});
    return new Uint8Array(await new Response(cs.readable).arrayBuffer());
  }catch(e){ return null; }
}
async function gunzipBytes(bytes){
  const ds = new DecompressionStream("gzip");
  const w = ds.writable.getWriter();
  // a corrupt link makes these reject on their own; swallow so it surfaces once, below
  w.write(bytes).catch(()=>{});
  w.close().catch(()=>{});
  return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
}
function shareableCopy(b){
  const c = JSON.parse(JSON.stringify(b));
  delete c.snaps; delete c.log;          // your check-in history stays yours
  c.sharedAt = iso(today());
  c.sharedName = b.name;
  return c;
}
async function buildShareLink(b){
  if(!b.shareId){ b.shareId = uid() + uid(); save(); }
  const json = JSON.stringify(shareableCopy(b));
  const gz = await gzipStr(json);
  const payload = gz ? "1" + B64.enc(gz)
                     : "0" + B64.enc(new TextEncoder().encode(json));
  const base = (typeof location !== "undefined" ? location.href.split("#")[0] : "");
  return base + "#b=" + payload;
}
async function readShareLink(hash){
  const raw = String(hash||"").replace(/^#b=/, "");
  if(!raw) return null;
  try{
    const mode = raw[0], data = B64.dec(raw.slice(1));
    const json = mode === "1" ? await gunzipBytes(data) : new TextDecoder().decode(data);
    const inc = JSON.parse(json);
    if(!inc || !inc.pay || !Array.isArray(inc.expenses)) return null;
    return inc;
  }catch(e){ return null; }
}

/* ---------- sending ---------- */
async function shareSheet(){
  const b = B();
  let url;
  try{ url = await buildShareLink(b); }
  catch(e){ toast("Couldn't build the link"); return; }
  const big = url.length > 12000;
  openSheet("Share this budget", `
    <p class="sec-note" style="margin-top:14px">The whole budget is packed into this one link. Send it to someone and the app will offer to load it on their phone. Send it again after you change something and it updates their copy in place rather than piling up duplicates.</p>
    <label class="f"><span>Link</span>
      <textarea id="shareUrl" rows="4" readonly style="font-size:12px;font-family:ui-monospace,Menlo,monospace;word-break:break-all">${esc(url)}</textarea></label>
    <button class="btn" style="margin-top:14px" id="shareGo">Send it</button>
    <button class="btn ghost" id="shareCopy">Copy the link</button>
    ${big?`<p class="hint" style="color:var(--clay)">This link is unusually long and some apps may cut it off. If it doesn't work, use Export a backup file instead and send that.</p>`:""}
    <div class="hr"></div>
    <p class="sec-note">Anyone holding this link can see this budget, so send it directly to the person you mean. It carries your income, bills, goals and balances — but not your check-in history.</p>
    <p class="sec-note">The plain app address, with nothing after the <b>#</b>, contains none of your data. That's the one to share with anyone who just wants the app.</p>`, null);
  $("shareGo").addEventListener("click", ()=>{
    if(navigator.share){
      navigator.share({ title:"Our budget", text:"Here's our paycheck plan", url }).catch(()=>{});
    } else { copyShare(url); }
  });
  $("shareCopy").addEventListener("click", ()=> copyShare(url));
}
function copyShare(url){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>toast("Link copied")).catch(()=>selectShare());
  } else selectShare();
}
function selectShare(){
  const el = $("shareUrl");
  if(el && el.select){ el.select(); toast("Press and hold to copy"); }
}

/* ---------- receiving ---------- */
async function takeIncomingShare(){
  if(typeof location === "undefined" || !location.hash || location.hash.indexOf("#b=") !== 0) return null;
  const inc = await readShareLink(location.hash);
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
  return inc;
}
function showImportSheet(inc, onDone){
  const per = (PAYF.find(f=>f.id===inc.pay.freq)||PAYF[0]).name.toLowerCase();
  const mine = store.budgets.find(x=>x.shareId && x.shareId === inc.shareId);
  const goals = (inc.goals||[]).length, bills = (inc.expenses||[]).length;
  const spend = (+inc.allowance||0) + (inc.buckets||[]).reduce((s,x)=>s+(+x.amount||0),0);
  openSheet(mine ? "Updated budget received" : "A budget was shared with you", `
    <div class="card" style="margin-top:14px;padding:15px 16px">
      <div class="row-title">${esc(inc.sharedName || inc.name || "Shared budget")}</div>
      <div class="row-sub" style="margin-top:5px">${money(inc.pay.amount||0)} ${per}
        · ${bills} bill${bills===1?"":"s"} · ${goals} goal${goals===1?"":"s"}
        · ${money(spend)} spending money a check</div>
    </div>
    ${mine ? `<p class="sec-note" style="margin-top:16px">You already have this budget as <b>${esc(mine.name)}</b>. Updating replaces it with this newer version, including anything you changed on your own copy.</p>
      <button class="btn" style="margin-top:8px" data-act="shareUpdate">Update ${esc(mine.name)}</button>
      <button class="btn ghost" data-act="shareAdd">Keep both, add as a copy</button>`
    : `<p class="sec-note" style="margin-top:16px">This adds it to your app as its own budget. Editing it afterwards only changes your copy — it doesn't send anything back.</p>
      <button class="btn" style="margin-top:8px" data-act="shareAdd">Add this budget</button>`}
    <button class="btn ghost" data-act="shareSkip">No thanks</button>`, null);
  PENDING_SHARE = { inc, mine, onDone };
}
let PENDING_SHARE = null;
function applyShare(mode){
  const ps = PENDING_SHARE; if(!ps) return;
  const { inc, mine, onDone } = ps;
  PENDING_SHARE = null;
  if(mode !== "skip"){
    const copy = JSON.parse(JSON.stringify(inc));
    copy.snaps = {}; copy.log = {};
    if(mode === "update" && mine){
      copy.id = mine.id; copy.name = mine.name;
      copy.snaps = mine.snaps || {}; copy.log = mine.log || {};
      store.budgets = store.budgets.map(x => x.id === mine.id ? copy : x);
    } else {
      copy.id = uid();
      if(mine) copy.name = (inc.sharedName || inc.name || "Shared") + " copy";
      store.budgets.push(copy);
    }
    store.activeId = copy.id;
    save();
  }
  closeSheet();
  if(onDone) onDone();
  if(mode !== "skip") toast(mode === "update" ? "Budget updated" : "Budget added");
}

/* Every suggestion in the Health tab can apply itself, but never silently:
   this spells out the before and after first. */
function askFix(fx){
  if(!fx) return;
  const b = B(), per = payPerYear(b);
  let title = "Apply this change?", body = "", apply = null;
  if(fx.act === "stretchGoal"){
    const g = (b.goals||[]).find(x=>x.id===fx.id); if(!g) return;
    const before = goalPerCheck(b,g);
    const after = goalPerCheck(b, Object.assign({}, g, {months:fx.months}));
    title = "Stretch " + g.name + "?";
    body = `The deadline moves from <b>${fmtMY(goalEnd(b,g))}</b> to <b>${fmtMY(addMonths(goalStart(b,g), fx.months))}</b>.
      Each paycheck puts in <b>${money(after)}</b> instead of ${money(before)}, which hands
      <b>${money(before-after)}</b> a check back to the rest of your budget.
      You still reach ${money(g.target)} — it just takes ${fx.months - (+g.months||12)} months longer.`;
    apply = ()=>{ g.months = fx.months; };
  } else if(fx.act === "trimAllowance"){
    const from = +b.allowance||0;
    title = "Trim loose spending money?";
    body = `Your loose spending goes from <b>${money(from)}</b> to <b>${money(fx.to)}</b> a check,
      freeing <b>${money((from-fx.to)*per/12)}</b> a month.
      ${bucketTotal(b)>0?`Anything you've earmarked stays exactly as it is.`:""}`;
    apply = ()=>{ b.allowance = fx.to; };
  } else if(fx.act === "setAllowance"){
    title = "Set aside spending money?";
    body = `<b>${money(fx.to)}</b> comes out of every paycheck as spending money, or
      <b>${money(fx.to*per/12)}</b> a month. You can split it into groceries, gas and the
      rest afterwards under Money.`;
    apply = ()=>{ b.allowance = fx.to; };
  } else if(fx.act === "addEF"){
    const g = { id:uid(), type:"savings", name:"Emergency fund", target:fx.amount,
                months:fx.months, saved:0, start:iso(today()) };
    title = "Start an emergency fund?";
    body = `A goal of <b>${money(fx.amount)}</b> over <b>${fx.months} months</b>, which asks
      <b>${money(goalPerCheck(b,g))}</b> of each paycheck. If that's too steep you can stretch
      it afterwards, and the Health tab will tell you if it doesn't fit.`;
    apply = ()=>{ b.goals = b.goals||[]; b.goals.push(g); };
  } else if(fx.act === "splitBill"){
    const e = b.expenses.find(x=>x.id===fx.id); if(!e) return;
    const slices = Math.max(2, Math.round(per/12));
    title = "Split " + e.name + " across paychecks?";
    body = `Instead of <b>${money(e.amount)}</b> leaving one check, about
      <b>${money((+e.amount||0)/slices)}</b> gets set aside from each check and the bill is
      paid when it's due. The money stays in checking until then.`;
    apply = ()=>{ e.sinking = true; e.splitManual = true; };
  } else if(fx.act === "removeBill"){
    const e = b.expenses.find(x=>x.id===fx.id); if(!e) return;
    title = "Remove " + e.name + "?";
    body = `It has a zero balance, so the <b>${money(monthlyCost(e))}</b> a month the plan is
      holding back for it goes back into your paychecks. This deletes the bill for good.`;
    apply = ()=>{ b.expenses = b.expenses.filter(x=>x.id!==fx.id); };
  } else return;
  openSheet(title, `
    <p style="margin:16px 0 0;font-size:14.5px;line-height:1.55;color:var(--ink2)">${body}</p>
    <button class="btn ghost" style="margin-top:20px" data-act="closeSheet">Leave it as it is</button>`,
    "Yes, update my budget", ()=>{
      apply(); save(); closeSheet(); render(); toast("Budget updated");
    });
}

      </div>`;
  } else if(s===4){
    body = `<div class="ob-step">Step 4 of 4</div><h1>What are you working toward?</h1>
      <p>One goal is enough to start. An emergency fund is the usual first choice. Skip it if you'd rather set this up later.</p>
      <label class="f"><span>Goal name</span><input type="text" id="obGName" placeholder="Emergency fund"></label>
      <div class="two"><label class="f"><span>Amount</span><div class="money-in"><input type="number" inputmode="decimal" id="obGTarget" step="0.01" placeholder="5000"></div></label>
      <label class="f"><span>Within</span><select id="obGMonths">${[3,6,9,12,18,24,36].map(m=>`<option value="${m}" ${m===12?"selected":""}>${m} months</option>`).join("")}</select></label></div>
      <div class="hint" id="obGPer"></div>`;
  }
  $("obRoot").innerHTML = `<div class="ob"><div class="ob-in">
    <div class="ob-bar"><span style="width:${s/steps*100}%"></span></div>
    <div class="ob-body">${body}</div>
    <div class="ob-foot"><div class="two">
      ${s>0?`<button class="btn ghost" id="obBack">Back</button>`:""}
      <button class="btn ${s===2?"ghost go":""}" id="obNextBtn">${s===0?"Get started":s===4?"Build my plan":s===2?"Done adding bills":"Continue"}</button>
    </div></div></div></div>`;
  if(s===3){
    const per = payPerYear(ob.b);
    const showAllow = ()=>{
      $("obAllowSub").textContent = money((ob.b.allowance||0)*per/12) + " a month";
      $("obRoot").querySelectorAll("[data-ob-allow]").forEach(el=>
        el.classList.toggle("on", (+el.dataset.obAllow) === (+ob.b.allowance||0)));
    };
    $("obAllow").addEventListener("input", ev=>{ ob.b.allowance = +ev.target.value||0; showAllow(); });
    $("obRoot").querySelectorAll("[data-ob-allow]").forEach(el=>{
      el.addEventListener("click", ()=>{
        ob.b.allowance = +el.dataset.obAllow;
        $("obAllow").value = ob.b.allowance;
        showAllow();
      });
    });
  }
  if(s===4){
    const upd = ()=>{ const t = parseFloat(val("obGTarget"))||0, m = +val("obGMonths");
      $("obGPer").textContent = t>0 ? "That's "+money(goalPerCheck(ob.b,{type:"savings",target:t,saved:0,months:m}))+" out of every paycheck." : ""; };
    ["obGTarget","obGMonths"].forEach(i=>$(i).addEventListener("input",upd));
    $("obGMonths").addEventListener("change",upd);
  }
  if(s===2){
    const nameEl = $("obName"), catEl = $("obCat");
    // picking a category names the bill for you, unless you've typed your own
    catEl.addEventListener("change", ()=>{
      const cur = nameEl.value.trim();
      if(cur === "" || CATS.some(c=>c.name === cur)) nameEl.value = catOf(catEl.value).name;
    });
    $("obAddBill").addEventListener("click", ()=>{
      const n = nameEl.value.trim(), a = parseFloat(val("obBillAmt"))||0;
      if(!n || a<=0){ toast("Add a name and an amount"); return; }
      const rec = { name:n, amount:a, cat:catEl.value, freq:val("obFreq2")||"monthly",
                    dueDay:+val("obDay")||1, dueDate:val("obDueDate")||iso(addDays(today(),14)) };
      if(ob.editId){
        const e = ob.b.expenses.find(x=>x.id===ob.editId);
        Object.assign(e, rec); ob.editId = null;
      } else {
        ob.b.expenses.push({ id:uid(), ...rec });
      }
      ob.lastCat = rec.cat;
      autoSplit(ob.b);
      drawOb();
    });
    $("obFreq2").addEventListener("change", ()=>{
      const m = val("obFreq2") === "monthly";
      $("obDueMonthly").style.display = m ? "block" : "none";
      $("obDueDated").style.display   = m ? "none"  : "block";
    });
    if($("obCancelEdit")) $("obCancelEdit").addEventListener("click", ()=>{ ob.editId=null; drawOb(); });
    $("obRoot").querySelectorAll("[data-ob-edit]").forEach(el=>{
      el.addEventListener("click", ()=>{ ob.editId = el.dataset.obEdit; drawOb(); });
    });
    $("obRoot").querySelectorAll("[data-ob-del]").forEach(el=>{
      el.addEventListener("click", ()=>{
        ob.b.expenses = ob.b.expenses.filter(x=>x.id!==el.dataset.obDel);
        if(ob.editId === el.dataset.obDel) ob.editId = null;
        drawOb();
      });
    });
  }
  if($("obBack")) $("obBack").addEventListener("click", ()=>{ collectOb(); ob.step--; drawOb(); });
  $("obNextBtn").addEventListener("click", ()=>{
    collectOb();
    if(ob.step===3) ob.b.allowance = Math.max(0, +val("obAllow")||0);
    if(ob.step===1 && !ob.b.pay.amount){ toast("Enter what you take home first"); return; }
    if(ob.step===4){
      store.budgets.push(ob.b); store.activeId = ob.b.id; store.seenIntro = true; save();
      $("obRoot").innerHTML = ""; ob=null; render(); toast("Your plan is ready");
      return;
    }
    ob.step++; drawOb();
  });
}
function collectOb(){
  const s = ob.step, b = ob.b;
  if(s===1){ b.pay.amount = parseFloat(val("obAmt"))||0; b.pay.freq = val("obFreq");
    b.pay.next = val("obNext")||b.pay.next; b.startBalance = parseFloat(val("obStart"))||0; }
  if(s===3){ b.allowance = Math.max(0, +val("obAllow")||0); }
  if(s===4){ const n = val("obGName").trim(), t = parseFloat(val("obGTarget"))||0;
    if(t>0) b.goals=[{ id:uid(), type:"savings", name:n||"Emergency fund", target:t,
      months:+val("obGMonths")||12, saved:0, start:iso(today()) }]; }
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click", ev=>{
  const t = ev.target;
  const tab = t.closest("[data-tab]");
  if(tab){ TAB = tab.dataset.tab; render(); window.scrollTo({top:0}); return; }
  const eq = t.closest("[data-eq]");
  if(eq){ const id = eq.dataset.eq; openChecks[id] = !openChecks[id]; render();
    const node = $("chk-"+id); if(node) node.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const ct = t.closest("[data-check-toggle]");
  if(ct){ const id = ct.dataset.checkToggle; openChecks[id] = !openChecks[id];
    $("chk-"+id).classList.toggle("open", openChecks[id]); return; }
  const gt = t.closest("[data-goaltick]");
  if(gt){ const bb = B(), k = goalKey(gt.dataset.goaltick, gt.dataset.check);
    setGoalPaid(bb, gt.dataset.goaltick, gt.dataset.check, +gt.dataset.amt, !paidRec(bb,k));
    save(); render(); return; }
  const it = t.closest("[data-item]");
  if(it){
    if(t.closest(".tick")){ togglePaidByKey(it.dataset.item); return; }
    itemSheet(it.dataset.item, it.dataset.check); return;
  }
  const fx = t.closest("[data-fix]");
  if(fx){ askFix(FIXES[+fx.dataset.fix]); return; }
  const a = t.closest("[data-act]");
  if(!a) return;
  const id = a.dataset.id, b = B();
  switch(a.dataset.act){
    case "editPay": payForm(); break;
    case "addExpense": expenseForm(null, a.dataset.cat); break;
    case "editExpense": closeSheet(); setTimeout(()=>expenseForm(id),180); break;
    case "delExpense": { const e2 = b.expenses.find(x=>x.id===id); if(!e2) break;
        askConfirm("Delete "+e2.name+"?",
          "It comes off every paycheck it was placed on, and the plan re-levels straight away.",
          "Delete this bill", ()=>{
            b.expenses = b.expenses.filter(x=>x.id!==id);
            Object.keys(b.pins||{}).forEach(k=>{ if(k.startsWith(id+"@")) delete b.pins[k]; });
            save(); render(); toast("Deleted — plan rebalanced");
          });
      } break;
    case "addBucket": bucketForm(null); break;
    case "editBucket": closeSheet(); setTimeout(()=>bucketForm(id), 180); break;
    case "delBucket": { const k2 = (b.buckets||[]).find(x=>x.id===id); if(!k2) break;
        askConfirm("Delete "+k2.name+"?",
          "That "+money(k2.amount)+" a check stops being held back, so it'll show up as spare money instead.",
          "Delete it", ()=>{
            b.buckets = (b.buckets||[]).filter(x=>x.id!==id); save(); render(); toast("Deleted");
          });
      } break;
    case "addExtra": extraForm(null); break;
    case "editExtra": extraForm(id); break;
    case "delExtra": b.extras = b.extras.filter(x=>x.id!==id); save(); closeSheet(); render(); break;
    case "addGoal": goalForm(null, a.dataset.type, false); break;
    case "addFlexGoal": goalForm(null, "savings", true); break;
    case "goalUp": case "goalDown": {
        const list = b.goals||[];
        const i = list.findIndex(x=>x.id===id);
        const flexIdx = list.map((g,k)=>g.flex?k:-1).filter(k=>k>=0);
        const pos = flexIdx.indexOf(i);
        const j = a.dataset.act==="goalUp" ? flexIdx[pos-1] : flexIdx[pos+1];
        if(j==null || j<0) break;
        const t = list[i]; list[i] = list[j]; list[j] = t;
        save(); render();
      } break;
    case "autoGoals": {
        // the standard sequence: a small cushion, then the debt, then a real cushion
        const p2 = buildPlan(b), an = analyze(b, p2);
        const essentials = Math.max(1, an.billsM + an.allowM);
        const owed = debtOwed(b);
        b.goals = b.goals || [];
        const add2 = (name, type, target) => b.goals.push({
          id:uid(), type, flex:true, name, target: target||0, months:0, saved:0, apr:0,
          start: iso(today()) });
        add2("Starter cushion", "savings", Math.round(Math.min(1000, essentials)));
        if(owed > 0) add2("Attack my debt", "debt", 0);
        add2("Emergency fund", "savings", Math.round(essentials*3));
        add2("Long-term savings", "savings", 0);
        save(); render();
        toast("Set up — each check now feeds these in order");
      } break;
    case "editGoal": goalForm(id); break;
    case "delGoal": { const g2 = (b.goals||[]).find(x=>x.id===id); if(!g2) break;
        askConfirm("Delete "+g2.name+"?",
          g2.flex ? "Whatever this was picking up each check goes to the next goal down the list, or stays unassigned if there isn't one."
                  : "The "+money(goalPerCheck(b,g2))+" a check it was taking goes back to the rest of your budget.",
          "Delete this goal", ()=>{
            b.goals = (b.goals||[]).filter(x=>x.id!==id); save(); render(); toast("Deleted");
          });
      } break;
    case "closeSheet": closeSheet(); break;
    case "setAllow":  b.allowance    = +a.dataset.val||0; save(); render(); break;
    case "setKeep":   b.keepPerCheck = +a.dataset.val||0; save(); render(); break;
    case "setExtra":  b.debtExtra    = +a.dataset.val||0; save(); render(); break;
    case "toggleRollover": b.rollover = !b.rollover; save(); render(); break;
    case "clearPastDue": {
        // route through setPaid so a card marked already-paid also drops its balance
        PLAN.unfunded.forEach(o=>{ if(!paidRec(b, o.key)) setPaid(b, o, true); });
        save(); render(); toast("Cleared — the plan starts from your next check"); } break;
    case "evenOut": {
        const r = evenOut(b);
        if(!r.changed.length){ toast("Already about as even as the due dates allow"); break; }
        b.expenses.forEach(e=>{ if(r.flags[e.id]){ e.sinking = true; e.splitManual = true; } });
        save(); render();
        toast("Split "+r.changed.join(" and ")+" — now "+money(r.after.lo)+" to "+money(r.after.hi)+" a check");
      } break;
    case "splitBill": { const e = b.expenses.find(x=>x.id===id);
        if(e){ e.sinking = true; e.splitManual = true; save(); render();
          toast("Split on — it'll come out of every check now"); } } break;
    case "togglePaid": togglePaidByKey(a.dataset.key, true); break;
    case "checkin": { const p = pendingCheckin(b); if(p) openCheckin(p.id); } break;
    case "unpin": { const k = a.dataset.key; if(b.pins) delete b.pins[k]; save(); closeSheet(); render(); toast("Back on automatic"); } break;
    case "pickBudget": store.activeId = id; save(); closeSheet(); render(); break;
    case "newBudget": { const nb = newBudget("Budget "+(store.budgets.length+1));
        store.budgets.push(nb); store.activeId = nb.id; save(); closeSheet(); render(); TAB="money"; render(); } break;
    case "dupBudget": { const copy = JSON.parse(JSON.stringify(b)); copy.id = uid();
        copy.name = b.name + " copy"; store.budgets.push(copy); store.activeId = copy.id; save(); closeSheet(); render();
        toast("Copied — change a goal and compare in Health"); } break;
    case "delBudget": {
        const t2 = id ? store.budgets.find(x=>x.id===id) : b;
        if(!t2) break;
        const last = store.budgets.length === 1;
        askConfirm("Delete \""+t2.name+"\"?",
          last ? "This is your only budget, so the app will start over from setup. Everything in it goes for good."
               : "Its bills, goals and history go for good. This can't be undone.",
          "Delete this budget", ()=>{
            store.budgets = store.budgets.filter(x=>x.id!==t2.id);
            if(store.activeId === t2.id) store.activeId = store.budgets.length ? store.budgets[0].id : null;
            save();
            if(!store.budgets.length){ $("obRoot").innerHTML = ""; startOnboarding(); }
            else { render(); toast("Deleted"); }
          });
      } break;
    case "shareBudget": shareSheet(); break;
    case "shareAdd": applyShare("add"); break;
    case "shareUpdate": applyShare("update"); break;
    case "shareSkip": applyShare("skip"); break;
    case "export": exportData(); break;
    case "importBtn": $("importFile").click(); break;
  }
});
document.addEventListener("change", ev=>{
  const b = B();
  if(ev.target.id==="horizonSel"){ b.horizon = +ev.target.value; save(); render(); }
  if(ev.target.id==="allowInput"){ b.allowance = Math.max(0, +ev.target.value||0); save(); render(); }
  if(ev.target.id==="extraInput"){ b.debtExtra = Math.max(0, +ev.target.value||0); save(); render(); }
  if(ev.target.id==="keepInput"){ b.keepPerCheck = Math.max(0, +ev.target.value||0); save(); render(); }
  if(ev.target.id==="importFile"){ importData(ev.target.files[0]); }
});
document.addEventListener("input", ev=>{
  if(ev.target.id==="allowInput" && $("allowVal")) $("allowVal").textContent = money(+ev.target.value||0);
  if(ev.target.id==="keepInput" && $("keepVal")) $("keepVal").textContent = money(+ev.target.value||0);
});
$("sheetClose").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
$("budgetBtn").addEventListener("click", budgetSheet);
$("settingsBtn").addEventListener("click", settingsSheet);
document.addEventListener("click", ev=>{ if(ev.target.id==="sheetSaveBtn"){ if(sheetSave) sheetSave(); else closeSheet(); } });
document.addEventListener("click", ev=>{ const sw = ev.target.closest(".sw"); if(sw && sw.id){ sw.classList.toggle("on"); } });

function togglePaidByKey(key, alsoClose){
  const b = B();
  let occ = null;
  PLAN.checks.forEach(c=>c.items.forEach(o=>{ if(o.key===key) occ = o; }));
  if(!occ){ (b.snaps&&Object.values(b.snaps)||[]).forEach(sn=>sn.items.forEach(o=>{ if(o.key===key) occ=o; })); }
  if(!occ) return;
  const was = !!paidRec(b, key);
  const rec = setPaid(b, occ, !was);
  save(); if(alsoClose) closeSheet(); render();
  const e = b.expenses.find(x=>x.id===occ.eid);
  if(!was && rec && rec.delta && e) toast(e.name + " now " + money(e.balance) + " — " + money(rec.interest) + " of that payment was interest");
}

/* ---------- backup ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(store,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "paycheck-plan-"+iso(today())+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast("Backup saved to your files");
}
function importData(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const p = JSON.parse(r.result);
      if(!p || !Array.isArray(p.budgets)) throw new Error("bad file");
      store = p; if(!store.activeId && store.budgets[0]) store.activeId = store.budgets[0].id;
      save(); closeSheet(); render(); toast("Backup restored");
    }catch(e){ toast("That file isn't a Paycheck Plan backup"); }
  };
  r.readAsText(file);
}

/* ---------- go ---------- */
load();
if(!store.budgets.length){ startOnboarding(); }
else {
  if(!store.activeId) store.activeId = store.budgets[0].id;
  const first = buildPlan(B()).checks[0];
  if(first) openChecks[first.id] = true;   // the next payday is what you came to see
  render();
  const due = pendingCheckin(B());
  if(due) openCheckin(due.id);
}
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
