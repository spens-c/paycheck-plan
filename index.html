      el.addEventListener("click", ()=>{ ob.editId = el.dataset.obEdit; drawOb(); });
    });
    $("obRoot").querySelectorAll("[data-ob-del]").forEach(el=>{
      el.addEventListener("click", ()=>{
        ob.b.expenses = ob.b.expenses.filter(x=>x.id!==el.dataset.obDel);
        if(ob.editId === el.dataset.obDel) ob.editId = null;
        drawOb();
      });
    });
  }
  if(s===3){
    const refresh = ()=>{
      const bt = (ob.b.buckets||[]).reduce((t,x)=>t+(+x.amount||0),0);
      const total = bt + (+ob.b.allowance||0);
      $("obSpendTotal").textContent = money(total);
      $("obAllowSub").textContent = money(total*typicalCount(ob.b.pay.freq)) + " in a normal month"
        + (ob.b.pay.amount>0 ? " · " + Math.round(total/ob.b.pay.amount*100) + "% of each check" : "");
    };
    const keepAllowance = ()=>{ ob.b.allowance = Math.max(0, +val("obAllow")||0); };
    $("obAllow").addEventListener("input", ()=>{ keepAllowance(); refresh(); });
    $("obBukAdd").addEventListener("click", ()=>{
      const name = val("obBukName").trim(), amt = parseFloat(val("obBukAmt"))||0;
      const cat = val("obBukCat");
      if(!name){ toast("Give it a name"); return; }
      if(amt<=0){ toast("Add an amount"); return; }
      keepAllowance();
      ob.b.buckets = ob.b.buckets || [];
      if(ob.bukEdit){
        const x = ob.b.buckets.find(v=>v.id===ob.bukEdit);
        if(x){ x.name = name; x.amount = amt; x.cat = cat; }
        ob.bukEdit = null;
      } else {
        ob.b.buckets.push({ id:uid(), name, amount:amt, cat });
      }
      ob.lastBukCat = cat;
      drawOb();
    });
    if($("obBukCancel")) $("obBukCancel").addEventListener("click", ()=>{
      keepAllowance(); ob.bukEdit = null; drawOb();
    });
    $("obRoot").querySelectorAll("[data-ob-buk-quick]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const [n,c] = el.dataset.obBukQuick.split("|");
        $("obBukName").value = n; $("obBukCat").value = c;
        if($("obBukAmt").focus) $("obBukAmt").focus();
      });
    });
    $("obRoot").querySelectorAll("[data-ob-buk-edit]").forEach(el=>{
      el.addEventListener("click", ()=>{ keepAllowance(); ob.bukEdit = el.dataset.obBukEdit; drawOb(); });
    });
    $("obRoot").querySelectorAll("[data-ob-buk-del]").forEach(el=>{
      el.addEventListener("click", ()=>{
        keepAllowance();
        ob.b.buckets = (ob.b.buckets||[]).filter(x=>x.id!==el.dataset.obBukDel);
        if(ob.bukEdit === el.dataset.obBukDel) ob.bukEdit = null;
        drawOb();
      });
    });
  }
  if($("obBack")) $("obBack").addEventListener("click", ()=>{ collectOb(); ob.step--; drawOb(); });
  if($("obCancel")) $("obCancel").addEventListener("click", cancelOnboarding);
  $("obNextBtn").addEventListener("click", ()=>{
    collectOb();
    if(ob.step===3) ob.b.allowance = Math.max(0, +val("obAllow")||0);
    if(ob.step===1){
      if(!ob.b.pay.amount){ toast("Enter what you take home, then save it"); return; }
      ob.paySaved = true;
    }
    if(ob.step===4){
      store.budgets.push(ob.b); store.activeId = ob.b.id; store.seenIntro = true; save();
      $("obRoot").innerHTML = ""; ob=null; render(); toast("Your plan is ready");
      return;
    }
    ob.step++; drawOb();
  });
}
function collectOb(){
  const s = ob.step, b = ob.b;
  if(s===0 && $("obBudgetName")) b.name = val("obBudgetName") || b.name;
  if(s===1 && !ob.paySaved){ b.pay.amount = parseFloat(val("obAmt"))||0; b.pay.freq = val("obFreq");
    b.pay.next = val("obNext")||b.pay.next; b.startBalance = parseFloat(val("obStart"))||0; }
  if(s===3){ b.allowance = Math.max(0, +val("obAllow")||0); }
  if(s===4){ const n = val("obGName").trim(), t = parseFloat(val("obGTarget"))||0;
    if(t>0) b.goals=[{ id:uid(), type:"savings", name:n||"Emergency fund", target:t,
      months:+val("obGMonths")||12, saved:0, start:iso(today()) }]; }
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener("click", ev=>{
  const t = ev.target;
  const tab = t.closest("[data-tab]");
  if(tab){ TAB = tab.dataset.tab; render(); window.scrollTo({top:0}); return; }
  const eq = t.closest("[data-eq]");
  if(eq){ const id = eq.dataset.eq; openChecks[id] = !openChecks[id]; render();
    const node = $("chk-"+id); if(node) node.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const ct = t.closest("[data-check-toggle]");
  if(ct){ const id = ct.dataset.checkToggle; openChecks[id] = !openChecks[id];
    $("chk-"+id).classList.toggle("open", openChecks[id]); return; }
  const gx = t.closest("[data-goal-toggle]");
  if(gx){ const gid = gx.dataset.goalToggle;
    openGoals[gid] = !openGoals[gid]; render(); return; }
  const gt = t.closest("[data-goaltick]");
  if(gt){ const bb = B(), k = goalKey(gt.dataset.goaltick, gt.dataset.check);
    setGoalPaid(bb, gt.dataset.goaltick, gt.dataset.check, +gt.dataset.amt, !paidRec(bb,k));
    save(); render(); return; }
  const it = t.closest("[data-item]");
  if(it){
    if(t.closest(".tick")){ togglePaidByKey(it.dataset.item); return; }
    itemSheet(it.dataset.item, it.dataset.check); return;
  }
  const fx = t.closest("[data-fix]");
  if(fx){ askFix(FIXES[+fx.dataset.fix]); return; }
  const a = t.closest("[data-act]");
  if(!a) return;
  const id = a.dataset.id, b = B();
  switch(a.dataset.act){
    case "editPay": payForm(); break;
    case "runSetup": startOnboarding(store.budgets.length > 1); break;
    case "goMoney": TAB = "money"; render(); window.scrollTo({top:0}); break;
    case "addExpense": expenseForm(null, a.dataset.cat); break;
    case "editExpense": { const e3 = b.expenses.find(x=>x.id===id);
        closeSheet();
        setTimeout(()=> (e3 && (e3.cat==="creditcard"||e3.cat==="loan")) ? debtForm(id) : expenseForm(id), 180);
      } break;
    case "delExpense": { const e2 = b.expenses.find(x=>x.id===id); if(!e2) break;
        askConfirm("Delete "+e2.name+"?",
          "It comes off every paycheck it was placed on, and the plan re-levels straight away.",
          "Delete this bill", ()=>{
            b.expenses = b.expenses.filter(x=>x.id!==id);
            Object.keys(b.pins||{}).forEach(k=>{ if(k.startsWith(id+"@")) delete b.pins[k]; });
            save(); render(); toast("Deleted — plan rebalanced");
          });
      } break;
    case "addBucket": bucketForm(null); break;
    case "editBucket": closeSheet(); setTimeout(()=>bucketForm(id), 180); break;
    case "delBucket": { const k2 = (b.buckets||[]).find(x=>x.id===id); if(!k2) break;
        askConfirm("Delete "+k2.name+"?",
          "That "+money(k2.amount)+" a check stops being held back, so it'll show up as spare money instead.",
          "Delete it", ()=>{
            b.buckets = (b.buckets||[]).filter(x=>x.id!==id); save(); render(); toast("Deleted");
          });
      } break;
    case "addExtra": extraForm(null); break;
    case "editExtra": extraForm(id); break;
    case "delExtra": b.extras = b.extras.filter(x=>x.id!==id); save(); closeSheet(); render(); break;
    case "addGoal": goalForm(null, a.dataset.type, false); break;
    case "addFlexGoal": goalForm(null, "savings", true); break;
    case "goalUp": case "goalDown": {
        const list = b.goals||[];
        const i = list.findIndex(x=>x.id===id);
        if(i < 0) break;                       // not a goal: never touch the array
        const flexIdx = list.map((g,k)=>g.flex?k:-1).filter(k=>k>=0);
        const pos = flexIdx.indexOf(i);
        if(pos < 0) break;
        const j = a.dataset.act==="goalUp" ? flexIdx[pos-1] : flexIdx[pos+1];
        if(j == null || j < 0 || j >= list.length) break;
        const t = list[i]; list[i] = list[j]; list[j] = t;
        save(); render();
      } break;
    case "autoGoals": {
        // the standard sequence: a small cushion, then the debt, then a real cushion
        const p2 = buildPlan(b), an = analyze(b, p2);
        const essentials = Math.max(1, an.billsM + an.allowM);
        const owed = debtOwed(b);
        b.goals = b.goals || [];
        const taken = n => b.goals.some(g => (g.name||"").trim().toLowerCase() === n.toLowerCase());
        const add2 = (name, type, target) => {
          // don't stack a second Emergency fund on top of one they already made
          if(taken(name)) return;
          if(type === "debt" && b.goals.some(g => g.flex && g.type === "debt")) return;
          b.goals.push({ id:uid(), type, flex:true, name, target: target||0,
                         months:0, saved:0, apr:0, start: iso(today()) });
        };
        add2("Starter cushion", "savings", Math.round(Math.min(1000, essentials)));
        if(owed > 0) add2("Attack my debt", "debt", 0);
        add2("Emergency fund", "savings", Math.round(essentials*3));
        add2("Long-term savings", "savings", 0);
        save(); render();
        toast(b.goals.filter(g=>g.flex).length
          ? "Set up — each check now feeds these in order"
          : "You already had these covered");
      } break;
    case "editGoal": goalForm(id); break;
    case "delGoal": { const g2 = (b.goals||[]).find(x=>x.id===id); if(!g2) break;
        askConfirm("Delete "+g2.name+"?",
          g2.flex ? "Whatever this was picking up each check goes to the next goal down the list, or stays unassigned if there isn't one."
                  : "The "+money(goalPerCheck(b,g2))+" a check it was taking goes back to the rest of your budget.",
          "Delete this goal", ()=>{
            b.goals = (b.goals||[]).filter(x=>x.id!==id); save(); render(); toast("Deleted");
          });
      } break;
    case "closeSheet": closeSheet(); break;
    case "setAllow":  b.allowance    = +a.dataset.val||0; save(); render(); break;
    case "setExtra":  b.debtExtra    = +a.dataset.val||0; save(); render(); break;
    case "addDebt": debtForm(null); break;
    case "editDebt": closeSheet(); setTimeout(()=>debtForm(id), 180); break;
    case "debtPlan": debtPlanSheet(id); break;
    case "fixPayment": fixPaymentSheet(a.dataset.key); break;
    case "missedPayment": {
        // a skipped payment isn't an erased month: the interest still landed
        correctPayment(b, a.dataset.key, 0);
        save(); closeSheet(); render(); toast("Recorded as missed — interest still applied");
      } break;
    case "toggleAutoPost": { b.autoPost = (b.autoPost === false);
        if(b.autoPost) b.lastPost = iso(today());
        save(); closeSheet(); render();
        toast(b.autoPost ? "Payments will post as due dates pass" : "You'll record payments yourself"); } break;
    case "toggleRollover": b.rollover = !b.rollover; save(); render(); break;
    case "clearPastDue": {
        // route through setPaid so a card marked already-paid also drops its balance
        PLAN.unfunded.forEach(o=>{ if(!paidRec(b, o.key)) setPaid(b, o, true); });
        save(); render(); toast("Cleared — the plan starts from your next check"); } break;
    case "evenOut": {
        const r = evenOut(b);
        if(!r.changed.length){ toast("Already about as even as the due dates allow"); break; }
        b.expenses.forEach(e=>{ if(r.flags[e.id]){ e.sinking = true; e.splitManual = true; } });
        save(); render();
        toast("Split "+r.changed.join(" and ")+" — now "+money(r.after.lo)+" to "+money(r.after.hi)+" a check");
      } break;
    case "togglePaid": togglePaidByKey(a.dataset.key, true); break;
    case "checkin": { const p = pendingCheckin(b); if(p) openCheckin(p.id); } break;
    case "unpin": { const k = a.dataset.key; if(b.pins) delete b.pins[k]; save(); closeSheet(); render(); toast("Back on automatic"); } break;
    case "pickBudget": store.activeId = id; save(); closeSheet(); render(); break;
    case "newBudget": closeSheet(); startOnboarding(true); break;
    case "dupBudget": { const copy = JSON.parse(JSON.stringify(b)); copy.id = uid();
        copy.name = b.name + " copy"; store.budgets.push(copy); store.activeId = copy.id; save(); closeSheet(); render();
        toast("Copied — change a goal and compare in Health"); } break;
    case "delBudget": {
        const t2 = id ? store.budgets.find(x=>x.id===id) : b;
        if(!t2) break;
        const last = store.budgets.length === 1;
        askConfirm("Delete \""+t2.name+"\"?",
          last ? "This is your only budget, so the app will start over from setup. Everything in it goes for good."
               : "Its bills, goals and history go for good. This can't be undone.",
          "Delete this budget", ()=>{
            store.budgets = store.budgets.filter(x=>x.id!==t2.id);
            if(store.activeId === t2.id) store.activeId = store.budgets.length ? store.budgets[0].id : null;
            save();
            if(!store.budgets.length){ $("obRoot").innerHTML = ""; startOnboarding(); }
            else { render(); toast("Deleted"); }
          });
      } break;
    case "shareBudget": shareSheet(); break;
    case "shareAdd": applyShare("add"); break;
    case "shareUpdate": applyShare("update"); break;
    case "shareSkip": applyShare("skip"); break;
    case "export": exportData(); break;
    case "importBtn": $("importFile").click(); break;
  }
});
document.addEventListener("change", ev=>{
  const b = B();
  if(ev.target.id==="horizonSel"){ b.horizon = +ev.target.value; save(); render(); }
  if(ev.target.id==="allowInput"){ b.allowance = Math.max(0, +ev.target.value||0); save(); render(); }
  if(ev.target.id==="extraInput"){ b.debtExtra = Math.max(0, +ev.target.value||0); save(); render(); }
  if(ev.target.id==="importFile"){ importData(ev.target.files[0]); }
});
document.addEventListener("input", ev=>{
  if(ev.target.id==="allowInput" && $("allowVal")) $("allowVal").textContent = money(+ev.target.value||0);
});
$("sheetClose").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
$("budgetBtn").addEventListener("click", budgetSheet);
$("settingsBtn").addEventListener("click", settingsSheet);
document.addEventListener("click", ev=>{ if(ev.target.id==="sheetSaveBtn"){ if(sheetSave) sheetSave(); else closeSheet(); } });
document.addEventListener("click", ev=>{ const sw = ev.target.closest(".sw"); if(sw && sw.id){ sw.classList.toggle("on"); } });

function togglePaidByKey(key, alsoClose){
  const b = B();
  let occ = null;
  PLAN.checks.forEach(c=>c.items.forEach(o=>{ if(o.key===key) occ = o; }));
  if(!occ){ (b.snaps&&Object.values(b.snaps)||[]).forEach(sn=>sn.items.forEach(o=>{ if(o.key===key) occ=o; })); }
  if(!occ) return;
  const was = !!paidRec(b, key);
  const rec = setPaid(b, occ, !was);
  save(); if(alsoClose) closeSheet(); render();
  const e = b.expenses.find(x=>x.id===occ.eid);
  if(!was && rec && rec.delta && e) toast(e.name + " now " + money(e.balance) + " — " + money(rec.interest) + " of that payment was interest");
}

/* ---------- backup ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(store,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "paycheck-plan-"+iso(today())+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast("Backup saved to your files");
}
function importData(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const p = JSON.parse(r.result);
      if(!p || !Array.isArray(p.budgets)) throw new Error("bad file");
      store = p; if(!store.activeId && store.budgets[0]) store.activeId = store.budgets[0].id;
      save(); closeSheet(); render(); toast("Backup restored");
    }catch(e){ toast("That file isn't a Paycheck Plan backup"); }
  };
  r.readAsText(file);
}

/* ---------- go ---------- */
function boot(){
  if(!store.budgets.length){ startOnboarding(); return; }
  if(!store.activeId) store.activeId = store.budgets[0].id;
  const first = buildPlan(B()).checks[0];
  if(first) openChecks[first.id] = true;   // the next payday is what you came to see
  render();
  const due = pendingCheckin(B());
  if(due) openCheckin(due.id);
}
load();
(async ()=>{
  let inc = null;
  try{ inc = await takeIncomingShare(); }catch(e){}
  if(inc){
    if(store.budgets.length) render();     // something to look at behind the sheet
    showImportSheet(inc, boot);
    return;
  }
  boot();
})();
if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", ()=> navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
